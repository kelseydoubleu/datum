      starter:"# Print the head of the sales data\n\n\n# Print information about sales\n\n\n# Print the shape of sales\n\n\n# Print a description of sales\n",
      solution:"# Print the head of the sales data\nprint(sales.head())\n\n# Print information about sales\nsales.info()\n\n# Print the shape of sales\nprint(sales.shape)\n\n# Print a description of sales\nprint(sales.describe())\n",
      check:"printed('(16, 7)', 'Print the shape of `sales` with `print(sales.shape)`.')\nprinted('Non-Null Count', 'Call `sales.info()`.')\nprinted('weekly_sales', 'Print the head of `sales`.')\nprinted('mean', 'Print `sales.describe()`.')"},
    {type:"code", title:"Parts of a DataFrame", xp:100,
      context:"To better understand DataFrame objects, it's useful to know that they consist of three components, stored as attributes:\n\n- `.values`: A two-dimensional NumPy array of values.\n- `.columns`: An index of columns: the column names.\n- `.index`: An index for the rows: either row numbers or row names.",

      starter:"# Print the values of sales\n\n\n# Print the column index of sales\n\n\n# Print the row index of sales\n",
      solution:"# Print the values of sales\nprint(sales.values)\n\n# Print the column index of sales\nprint(sales.columns)\n\n# Print the row index of sales\nprint(sales.index)\n",
      check:"printed('RangeIndex(start=0, stop=16, step=1)', 'Print `sales.index`.')\nprinted(\"Index(['store'\", 'Print `sales.columns`.')\nprinted('2023-01-06', 'Print `sales.values`.')"},
    {type:"video", title:"Sorting and subsetting", slides:[
      {h:"Sorting", b:["sort_values() sorts by one or more columns","ascending=False sorts from high to low"], code:"dogs.sort_values(\"weight_kg\", ascending=False)\ndogs.sort_values([\"weight_kg\", \"height_cm\"], ascending=[True, False])"},
      {h:"Subsetting columns", b:["One column with single brackets gives a Series","Several columns with double brackets give a DataFrame"], code:"dogs[\"name\"]\ndogs[[\"breed\", \"height_cm\"]]"},
      {h:"Subsetting rows", b:["Pass a boolean condition inside the brackets","Combine conditions with & and |, wrapped in parentheses"], code:"dogs[dogs[\"height_cm\"] > 50]\ndogs[(dogs[\"breed\"] == \"Labrador\") & (dogs[\"color\"] == \"Brown\")]"},
      {h:".isin()", b:["Filter on multiple values of a categorical column"], code:"dogs[dogs[\"color\"].isin([\"Black\", \"Brown\"])]"}
    ]},
    {type:"code", title:"Sorting rows", xp:100,
      context:"Finding interesting bits of data in a DataFrame is often easier if you change the order of the rows. You can sort the rows by passing a column name to `.sort_values()`.\n\nIn cases where rows have the same value, you may wish to sort by a second column. Pass a list of column names, and a list of booleans to `ascending`.",
      instr:["Sort `sales` by `weekly_sales` in descending order. Save this as `sales_srt`.","Sort `sales` by `store` ascending, then by `weekly_sales` descending. Save this as `sales_store_srt`.","Print the head of `sales_srt`."],
      hint:"`sales.sort_values([\"store\", \"weekly_sales\"], ascending=[True, False])`.",
      starter:"# Sort sales by weekly_sales, descending\nsales_srt = \n\n# Sort by store ascending, then weekly_sales descending\nsales_store_srt = \n\n# Print the head of sales_srt\n",
      solution:"# Sort sales by weekly_sales, descending\nsales_srt = sales.sort_values(\"weekly_sales\", ascending=False)\n\n# Sort by store ascending, then weekly_sales descending\nsales_store_srt = sales.sort_values([\"store\", \"weekly_sales\"], ascending=[True, False])\n\n# Print the head of sales_srt\nprint(sales_srt.head())\n",
      check:"eq_var('sales_srt', 'Sort `sales` by `\"weekly_sales\"` with `ascending=False`.')\neq_var('sales_store_srt', 'Sort by `[\"store\", \"weekly_sales\"]` with `ascending=[True, False]`.')\nout_has_sol('Print the head of `sales_srt`.')"},
    {type:"code", title:"Subsetting columns", xp:100,
      context:"When working with data, you may not need all of the variables in your dataset. Square brackets (`[]`) can be used to select only the columns that matter to you. Use double brackets to select multiple columns.",
      instr:["Create a Series called `weekly` containing only the `weekly_sales` column.","Create a DataFrame called `store_dept` that contains the `store` and `department` columns, in that order.","Print the head of `store_dept`."],
      hint:"`sales[[\"store\", \"department\"]]` uses two pairs of brackets.",

      solution:"# Select the weekly_sales column\nweekly = sales[\"weekly_sales\"]\n\n# Select the store and department columns\nstore_dept = sales[[\"store\", \"department\"]]\n\n# Print the head of the result\nprint(store_dept.head())\n",
      check:"eq_var('weekly', 'Select the `weekly_sales` column with single brackets.')\neq_var('store_dept', 'Select `[\"store\", \"department\"]` with double brackets.')\nout_has_sol('Print the head of `store_dept`.')"},
    {type:"code", title:"Subsetting rows", xp:100,
      context:"A large part of data science is about finding which bits of your dataset are interesting. One of the simplest techniques for this is to find a subset of rows that match some criteria, also known as filtering rows.\n\nYou can filter for multiple conditions at once by using the `&` operator.",
      instr:["Filter `sales` for rows where `weekly_sales` is greater than 40000. Assign to `big_weeks`.","Filter `sales` for rows where `type` is `\"A\"` and `date` is `\"2023-01-06\"`. Assign to `type_a_jan`."],
      hint:"Wrap each condition in parentheses: `(sales[\"type\"] == \"A\") & (sales[\"date\"] == \"2023-01-06\")`.",
      starter:"# Filter for weekly sales above 40000\nbig_weeks = \n\n# Filter for type A stores on 2023-01-06\ntype_a_jan = \n\nprint(big_weeks)\nprint(type_a_jan)\n",
      solution:"# Filter for weekly sales above 40000\nbig_weeks = sales[sales[\"weekly_sales\"] > 40000]\n\n# Filter for type A stores on 2023-01-06\ntype_a_jan = sales[(sales[\"type\"] == \"A\") & (sales[\"date\"] == \"2023-01-06\")]\n\nprint(big_weeks)\nprint(type_a_jan)\n",
      check:"eq_var('big_weeks', 'Use `sales[sales[\"weekly_sales\"] > 40000]`.')\neq_var('type_a_jan', 'Combine both conditions with `&`.')"},
    {type:"code", title:"Subsetting with .isin()", xp:100,
      context:"Subsetting data based on a categorical variable often involves using the \"or\" operator (`|`) to select rows from multiple categories. This can get tedious. Instead, use the `.isin()` method.",
      instr:["Filter `sales` for rows where `store` is either `2` or `4`. Assign the result to `stores_2_4` and print it."],
      hint:"`sales[sales[\"store\"].isin([2, 4])]`",
      starter:"# Filter for stores 2 and 4\nstores_2_4 = \n\nprint(stores_2_4)\n",
      solution:"# Filter for stores 2 and 4\nstores_2_4 = sales[sales[\"store\"].isin([2, 4])]\n\nprint(stores_2_4)\n",
      check:"eq_var('stores_2_4', 'Use `.isin([2, 4])` on the `store` column.')"},
    {type:"video", title:"New columns", slides:[

      instr:["Add a new column to `sales` called `weekly_sales_k`, containing `weekly_sales` in thousands of dollars.","Add a new column called `temperature_f`, containing the temperature in Fahrenheit: `temperature_c * 9 / 5 + 32`.","Print the head of `sales`."],
      hint:"`sales[\"weekly_sales_k\"] = sales[\"weekly_sales\"] / 1000`.",

      solution:"# Add weekly_sales_k\nsales[\"weekly_sales_k\"] = sales[\"weekly_sales\"] / 1000\n\n# Add temperature_f\nsales[\"temperature_f\"] = sales[\"temperature_c\"] * 9 / 5 + 32\n\n# Print the head of sales\nprint(sales.head())\n",
      check:"need('weekly_sales_k' in U['sales'].columns, 'Add the `weekly_sales_k` column.')\nneed('temperature_f' in U['sales'].columns, 'Add the `temperature_f` column.')\neq_var('sales', 'Check the formulas for the new columns.')"},
    {type:"code", title:"Combo-attack!", xp:100,
      context:"You've seen the four most common types of data manipulation: sorting rows, subsetting columns, subsetting rows, and adding new columns. In a real-life data analysis, you can mix and match these four manipulations to answer a multitude of questions.",
      instr:["Filter `sales` for weeks with `weekly_sales` above 30000. Assign to `high_sales`.","Sort `high_sales` by `temperature_c` ascending. Assign to `high_sales_srt`.","Select the `store`, `department` and `temperature_c` columns of `high_sales_srt` and assign to `result`. Print `result`."],
      hint:"Build it step by step, one variable at a time.",
      starter:"# Filter for weekly sales above 30000\nhigh_sales = \n\n# Sort by temperature_c\nhigh_sales_srt = \n\n# Select store, department and temperature_c\nresult = \n\nprint(result)\n",
      solution:"# Filter for weekly sales above 30000\nhigh_sales = sales[sales[\"weekly_sales\"] > 30000]\n\n# Sort by temperature_c\nhigh_sales_srt = high_sales.sort_values(\"temperature_c\")\n\n# Select store, department and temperature_c\nresult = high_sales_srt[[\"store\", \"department\", \"temperature_c\"]]\n\nprint(result)\n",

  ]},
  { title:"Aggregating DataFrames", desc:"Calculate summary statistics on DataFrame columns, master grouped summary statistics and pivot tables.",
    lessons:[
    {type:"video", title:"Summary statistics", slides:[
      {h:"Summarizing numerical data", b:[".mean(), .median(), .mode()",".min(), .max(), .var(), .std(), .sum(), .quantile()"], code:"dogs[\"height_cm\"].mean()", out:"49.714285714285715"},
      {h:"The .agg() method", b:["Apply custom functions to one or more columns"], code:"def pct30(column):\n    return column.quantile(0.3)\n\ndogs[\"weight_kg\"].agg(pct30)\ndogs[[\"weight_kg\", \"height_cm\"]].agg([pct30, \"median\"])"},
      {h:"Cumulative statistics", b:[".cumsum(), .cummax(), .cummin(), .cumprod()"], code:"dogs[\"weight_kg\"].cumsum()"}
    ]},
    {type:"code", title:"Mean and median", xp:100,
      context:"Summary statistics are exactly what they sound like: they summarize many numbers in one statistic. For example, mean, median, minimum, maximum, and standard deviation.\n\nSummary statistics work on dates too: `.max()` on a column of ISO date strings gives the latest date.",
      instr:["Print the mean of `weekly_sales`.","Print the median of `weekly_sales`.","Print the maximum of the `date` column."],
      hint:"`print(sales[\"weekly_sales\"].mean())`.",
      starter:"# Print the mean of weekly_sales\n\n\n# Print the median of weekly_sales\n\n\n# Print the maximum of the date column\n",
      solution:"# Print the mean of weekly_sales\nprint(sales[\"weekly_sales\"].mean())\n\n# Print the median of weekly_sales\nprint(sales[\"weekly_sales\"].median())\n\n# Print the maximum of the date column\nprint(sales[\"date\"].max())\n",
      check:"out_has_sol('Print the mean, the median, and the maximum date, in that order.')"},
    {type:"code", title:"Efficient summaries", xp:100,
      context:"While pandas and NumPy have tons of functions, sometimes you may need a different function to summarize your data. The `.agg()` method allows you to apply your own custom functions to a DataFrame.\n\nThe interquartile range (IQR) is the 75th percentile minus the 25th percentile.",
      instr:["Use the custom `iqr` function defined for you, along with `.agg()`, to print the IQR of the `temperature_c` column.","Update the column selection to use the custom `iqr` function with `.agg()` to print the IQR of `temperature_c` and `weekly_sales`, along with their median. Pass `[iqr, \"median\"]`."],
      hint:"`sales[[\"temperature_c\", \"weekly_sales\"]].agg([iqr, \"median\"])`.",
      starter:"# A custom IQR function\ndef iqr(column):\n    return column.quantile(0.75) - column.quantile(0.25)\n\n# Print IQR of the temperature_c column\n\n\n# Print IQR and median of temperature_c and weekly_sales\n",
      solution:"# A custom IQR function\ndef iqr(column):\n    return column.quantile(0.75) - column.quantile(0.25)\n\n# Print IQR of the temperature_c column\nprint(sales[\"temperature_c\"].agg(iqr))\n\n# Print IQR and median of temperature_c and weekly_sales\nprint(sales[[\"temperature_c\", \"weekly_sales\"]].agg([iqr, \"median\"]))\n",
      check:"out_has_sol('Print the IQR of `temperature_c`, then the table of IQR and median for both columns.')"},
    {type:"code", title:"Cumulative statistics", xp:100,
      context:"Cumulative statistics can also be helpful in tracking summary statistics over time. In this exercise, you'll calculate the cumulative sum and cumulative max of a store's weekly sales.",
      instr:["Add a column `cum_weekly_sales` to `store_1` that is the cumulative sum of `weekly_sales`.","Add a column `cum_max_sales` that is the cumulative maximum of `weekly_sales`.","Print the `date`, `weekly_sales`, `cum_weekly_sales` and `cum_max_sales` columns."],
      hint:"`store_1[\"weekly_sales\"].cumsum()` and `.cummax()`.",
      starter:"# Subset store 1 and sort by date\nstore_1 = sales[sales[\"store\"] == 1].sort_values(\"date\").copy()\n\n# Cumulative sum of weekly_sales\n\n\n# Cumulative max of weekly_sales\n\n\n# Print the columns\n",
      solution:"# Subset store 1 and sort by date\nstore_1 = sales[sales[\"store\"] == 1].sort_values(\"date\").copy()\n\n# Cumulative sum of weekly_sales\nstore_1[\"cum_weekly_sales\"] = store_1[\"weekly_sales\"].cumsum()\n\n# Cumulative max of weekly_sales\nstore_1[\"cum_max_sales\"] = store_1[\"weekly_sales\"].cummax()\n\n# Print the columns\nprint(store_1[[\"date\", \"weekly_sales\", \"cum_weekly_sales\", \"cum_max_sales\"]])\n",
      check:"need('cum_weekly_sales' in U['store_1'].columns, 'Add the `cum_weekly_sales` column.')\nneed('cum_max_sales' in U['store_1'].columns, 'Add the `cum_max_sales` column.')\neq_var('store_1', 'Use `.cumsum()` and `.cummax()` on `weekly_sales`.')"},
    {type:"video", title:"Counting", slides:[

    {type:"code", title:"Dropping duplicates", xp:100,
      context:"Removing duplicates is an essential skill to get accurate counts because often, you don't want to count the same thing multiple times. In `sales`, each store appears four times. To count store types correctly, you first need one row per store.",
      instr:["Remove rows of `sales` with duplicate pairs of `store` and `type`. Save as `store_types` and print the head.","Remove rows of `sales` with duplicate pairs of `store` and `department`. Save as `store_depts`."],
      hint:"`sales.drop_duplicates(subset=[\"store\", \"type\"])`.",
      starter:"# Drop duplicate store/type combinations\nstore_types = \nprint(store_types.head())\n\n# Drop duplicate store/department combinations\nstore_depts = \n",
      solution:"# Drop duplicate store/type combinations\nstore_types = sales.drop_duplicates(subset=[\"store\", \"type\"])\nprint(store_types.head())\n\n# Drop duplicate store/department combinations\nstore_depts = sales.drop_duplicates(subset=[\"store\", \"department\"])\n",

/* ================= MATPLOTLIB ================= */
{

  desc:"Learn how to create, customize, and share data visualizations using Matplotlib, Python's foundational plotting library.",
  long:"Visualizing data is the fastest way to understand it and to share what you found. In this course you'll use Matplotlib's object-oriented interface to create figures and axes, plot lines, customize markers, colors and labels, build small multiples, and compare distributions with bar charts, histograms and scatter plots. Data: monthly climate normals for Seattle and Austin.",

  chapters:[
  { title:"Introduction to Matplotlib", desc:"Create figures and axes, plot data, and customize your plots so they communicate clearly.",
    lessons:[
    {type:"video", title:"Introduction to Matplotlib", slides:[
      {h:"Data visualization", b:["Explore data and communicate results","Matplotlib gives you control over every element of a figure"]},
      {h:"The pyplot interface", b:["plt.subplots() creates a Figure and an Axes","The Figure is the container, the Axes holds the data"], code:"import matplotlib.pyplot as plt\nfig, ax = plt.subplots()\nplt.show()"},
      {h:"Adding data", b:["Call plotting methods on the Axes","Each call adds to the same Axes"], code:"ax.plot(seattle_weather[\"MONTH\"], seattle_weather[\"HIGH_F\"])\nax.plot(austin_weather[\"MONTH\"], austin_weather[\"HIGH_F\"])\nplt.show()"}

    {type:"code", title:"Using the plt.subplots command", xp:100,
      context:"Creating a figure with Matplotlib involves multiple steps. First, you create a Figure and an Axes object with `plt.subplots()`. Even without data, this produces an empty plot you can see in the **Plots** tab.\n\n`matplotlib.pyplot` is already imported as `plt`.",
      instr:["Call `plt.subplots()` to create a figure and axes objects, unpacking them into `fig` and `ax`.","Call `plt.show()` to display the result."],
      hint:"`fig, ax = plt.subplots()`",
      starter:"# Create a Figure and an Axes with plt.subplots\n\n\n# Call the show function to show the result\n",
      solution:"# Create a Figure and an Axes with plt.subplots\nfig, ax = plt.subplots()\n\n# Call the show function to show the result\nplt.show()\n",
      check:"has_var('fig')\nhas_var('ax')\nneed(len(ufigs()) > 0, 'Create the figure with `plt.subplots()`.')"},
    {type:"code", title:"Adding data to an Axes object", xp:100,
      context:"Adding data to a figure is done by calling methods of the `Axes` object. The DataFrames `seattle_weather` and `austin_weather` hold monthly climate data. The `\"MONTH\"` column holds month names and `\"HIGH_F\"` the average high temperature in degrees Fahrenheit.",

      hint:"`ax.plot(seattle_weather[\"MONTH\"], seattle_weather[\"HIGH_F\"])`, then the same for Austin.",
      starter:"fig, ax = plt.subplots()\n\n# Plot MONTH and HIGH_F from seattle_weather\n\n\n# Plot MONTH and HIGH_F from austin_weather\n\n\n# Call the show function\nplt.show()\n",
      solution:"fig, ax = plt.subplots()\n\n# Plot MONTH and HIGH_F from seattle_weather\nax.plot(seattle_weather[\"MONTH\"], seattle_weather[\"HIGH_F\"])\n\n# Plot MONTH and HIGH_F from austin_weather\nax.plot(austin_weather[\"MONTH\"], austin_weather[\"HIGH_F\"])\n\n# Call the show function\nplt.show()\n",
      check:"ax = uax()\nneed(len(ax.lines) == 2, 'Plot two lines on the same Axes: Seattle first, then Austin.')\nimport numpy as _np\nneed(list(_np.asarray(ax.lines[0].get_ydata())) == list(S['seattle_weather']['HIGH_F']), 'The first line should show Seattle\\'s `HIGH_F`.')\nneed(list(_np.asarray(ax.lines[1].get_ydata())) == list(S['austin_weather']['HIGH_F']), 'The second line should show Austin\\'s `HIGH_F`.')"},
    {type:"code", title:"Customizing your plots", xp:100,

      instr:["Plot Seattle with circle markers (`\"o\"`), a dashed line and the color blue (`\"b\"`).","Plot Austin with triangle markers (`\"v\"`), a dashed line and the color red (`\"r\"`)."],
      hint:"`ax.plot(x, y, marker=\"o\", linestyle=\"--\", color=\"b\")`.",
      starter:"fig, ax = plt.subplots()\n\n# Plot Seattle data, setting data appearance\nax.plot(seattle_weather[\"MONTH\"], seattle_weather[\"HIGH_F\"])\n\n# Plot Austin data, setting data appearance\nax.plot(austin_weather[\"MONTH\"], austin_weather[\"HIGH_F\"])\n\nplt.show()\n",
      solution:"fig, ax = plt.subplots()\n\n# Plot Seattle data, setting data appearance\nax.plot(seattle_weather[\"MONTH\"], seattle_weather[\"HIGH_F\"], marker=\"o\", linestyle=\"--\", color=\"b\")\n\n# Plot Austin data, setting data appearance\nax.plot(austin_weather[\"MONTH\"], austin_weather[\"HIGH_F\"], marker=\"v\", linestyle=\"--\", color=\"r\")\n\nplt.show()\n",
      check:"from matplotlib.colors import to_hex\nax = uax()\nneed(len(ax.lines) == 2, 'Plot two lines on the same Axes.')\na, b = ax.lines\nneed(a.get_marker() == 'o' and b.get_marker() == 'v', 'Use `marker=\"o\"` for Seattle and `marker=\"v\"` for Austin.')\nneed(a.get_linestyle() == '--' and b.get_linestyle() == '--', 'Set `linestyle=\"--\"` on both lines.')\nneed(to_hex(a.get_color()) == '#0000ff' and to_hex(b.get_color()) == '#ff0000', 'Set `color=\"b\"` for Seattle and `color=\"r\"` for Austin.')"},

      instr:["Set the x-axis label to `\"Time (months)\"`.","Set the y-axis label to `\"Average high temperature (F)\"`.","Set the title to `\"Weather in Seattle and Austin\"`."],
      hint:"`ax.set_xlabel(\"Time (months)\")`.",
      starter:"fig, ax = plt.subplots()\nax.plot(seattle_weather[\"MONTH\"], seattle_weather[\"HIGH_F\"], marker=\"o\", color=\"b\")\nax.plot(austin_weather[\"MONTH\"], austin_weather[\"HIGH_F\"], marker=\"v\", color=\"r\")\n\n# Customize the x-axis label\n\n\n# Customize the y-axis label\n\n\n# Add the title\n\n\nplt.show()\n",

      check:"ax = uax()\nneed(ax.get_xlabel() == 'Time (months)', 'Set the x-axis label to `\"Time (months)\"`.')\nneed(ax.get_ylabel() == 'Average high temperature (F)', 'Set the y-axis label to `\"Average high temperature (F)\"`.')\nneed(ax.get_title() == 'Weather in Seattle and Austin', 'Set the title to `\"Weather in Seattle and Austin\"`.')"},

      instr:["Create a Figure with an array of two Axes objects that share their y-axis range, stacked in 2 rows and 1 column.","Plot Seattle's `\"HIGH_F\"` in blue (`color=\"b\"`) on the top Axes.","Plot Austin's `\"HIGH_F\"` in red (`color=\"r\"`) on the bottom Axes."],

})();

/* ===== Power BI modeling, DAX, and Fabric courses (practiced in SQL on the portfolio dataset) ===== */
const PF = { pkgs:["sqlite3"], lang:"sql", seed:PORTFOLIO.sql, schema:PORTFOLIO.schema,
  datasets:["Atelier portfolio: a fictional design firm with projects, offices, clients, staff and monthly fees (Jan 2025 to Oct 2026)"] };

/* ---------- Data Modeling for Power BI ---------- */
COURSES.push(Object.assign({}, PF, {
  id:"pbi-modeling", title:"Data Modeling for Power BI", tech:"Power BI", level:"Intermediate", hours:3,
  desc:"Design semantic models that give the right numbers: star schemas, relationships, filter direction, date tables and data quality.",
  long:"A Power BI report is only as good as the semantic model behind it. In this course you'll learn to think in facts and dimensions, read relationship cardinality and filter direction, and spot the modeling mistakes that quietly inflate totals or produce (Blank) rows. Power BI itself can't run in a browser, so you'll practice each concept by querying a design firm's star schema with SQL: every relationship in Power BI behaves like a join, and every slicer like a filter.",
  prereq:["intro-sql"],
  chapters:[
  { title:"Star Schemas", desc:"Learn the shape that Power BI is built for: fact tables of events surrounded by dimension tables that describe them.",
    lessons:[
    {type:"video", title:"Facts and dimensions", slides:[
      {h:"Two kinds of tables", b:["Fact tables record events or measurements: fees billed, hours worked","Dimension tables describe the things involved: projects, offices, clients, dates","Facts are long and narrow; dimensions are short and wide"]},
      {h:"The star schema", b:["One fact table in the middle","Each dimension connects to it through a key","Power BI's engine, VertiPaq, is optimized for this shape"], code:"dim_office    dim_client\n       \\        /\n       fact_fees ---- dim_date\n           |\n      dim_project"},
      {h:"Grain", b:["The grain is what one row of the fact table represents","Here: one project, one month","Decide the grain first; every measure depends on it"]},
      {h:"Keys", b:["A dimension has one row per key (the one side)","A fact table repeats keys many times (the many side)","These keys are what relationships connect"]}
    ]},
    {type:"code", title:"Explore the fact table", xp:100,
      context:"`fact_fees` stores the fees billed and hours worked on each project. Before building anything in Power BI, you need to know how big a fact table is and what it covers.\n\nThe tables are listed in the **Tables** tab below the editor.",
      instr:["Return one row with three columns: the number of rows in `fact_fees` as `row_count`, the number of distinct `project_id` values as `projects`, and the number of distinct `month_date` values as `months`."],
      hint:"`SELECT COUNT(*) AS row_count, COUNT(DISTINCT project_id) AS projects, COUNT(DISTINCT month_date) AS months FROM fact_fees;`",
      starter:"-- Profile the fact table\n",
      solution:"-- Profile the fact table\nSELECT COUNT(*) AS row_count,\n       COUNT(DISTINCT project_id) AS projects,\n       COUNT(DISTINCT month_date) AS months\nFROM fact_fees;\n"},
    {type:"code", title:"Check the grain", xp:100,
      context:"The grain of `fact_fees` should be one row per project per month. If any project appears twice in the same month, totals in Power BI will double count. A query that returns no rows is the result you're hoping for here.",
      instr:["Group `fact_fees` by `project_id` and `month_date`.","Return the groups that have more than one row, with columns `project_id`, `month_date` and `n` (the row count)."],
      hint:"Use `GROUP BY project_id, month_date` and `HAVING COUNT(*) > 1`.",
      starter:"-- Find any project-months with more than one row\n",
      solution:"-- Find any project-months with more than one row\nSELECT project_id, month_date, COUNT(*) AS n\nFROM fact_fees\nGROUP BY project_id, month_date\nHAVING COUNT(*) > 1;\n"},
    {type:"code", title:"Relationships are joins", xp:100,
      context:"When you put `dim_office[region]` on a visual next to a fees measure, Power BI follows the relationship from `dim_office` to `fact_fees`. In SQL, that's a join on the key both tables share.",
      instr:["Join `fact_fees` to `dim_office` on `office_id`.","Return each `region` with the sum of `fee_usd` as `total_fees`.","Sort by `total_fees` from highest to lowest."],
      hint:"`JOIN dim_office o ON f.office_id = o.office_id`, then `GROUP BY o.region`.",
      starter:"-- Total fees by region\n",
      solution:"-- Total fees by region\nSELECT o.region, SUM(f.fee_usd) AS total_fees\nFROM fact_fees f\nJOIN dim_office o ON f.office_id = o.office_id\nGROUP BY o.region\nORDER BY total_fees DESC;\n"},
    {type:"mcq", title:"Fact or dimension?",
      context:"Classifying tables correctly is the first modeling decision you make.",
      q:"A table has one row per staff member with their name, role and home office. What kind of table is it?",
      options:["A fact table","A dimension table","A bridge table","A date table"], answer:1,
      fb:["Facts record events or measurements, like hours worked.","Correct! It describes staff, so it's a dimension.","A bridge connects two dimensions in a many-to-many relationship.","It doesn't describe dates."]}
  ]},
  { title:"Relationships and Filter Direction", desc:"Understand cardinality, how filters flow through relationships, and why bidirectional filters and many-to-many relationships can inflate totals.",
    lessons:[
    {type:"video", title:"Cardinality and filter direction", slides:[
      {h:"Cardinality", b:["One-to-many (1:*): one office, many fee rows. The default and the best choice","One-to-one (1:1): rare, often means two tables should be merged","Many-to-many (*:*): needs care, or a bridge table"]},
      {h:"Filter direction", b:["Single: filters flow from the one side to the many side","Selecting New York in a slicer filters fact_fees to New York rows","The fact table doesn't filter the dimension back"]},
      {h:"Both (bidirectional)", b:["Filters flow both ways across the relationship","Can make slicers show only values with data","But can create ambiguous paths, slow models and surprising totals","Use it rarely, and on purpose"]},
      {h:"Active and inactive", b:["Only one active path between two tables","Extra relationships stay inactive","Measures can turn one on with USERELATIONSHIP()"]}

    {type:"code", title:"Filters flow from dimensions", xp:100,
      context:"A slicer on `dim_project[practice_area]` set to Hospitality filters `dim_project`, and that filter flows along the one-to-many relationship into `fact_fees`.",
      instr:["Return the total `fee_usd` for projects whose `practice_area` is `Hospitality`, as a single column named `hospitality_fees`."],
      hint:"Join `fact_fees` to `dim_project` on `project_id`, then filter with `WHERE p.practice_area = 'Hospitality'`.",
      starter:"-- Fees for Hospitality projects\n",
      solution:"-- Fees for Hospitality projects\nSELECT SUM(f.fee_usd) AS hospitality_fees\nFROM fact_fees f\nJOIN dim_project p ON f.project_id = p.project_id\nWHERE p.practice_area = 'Hospitality';\n"},
    {type:"code", title:"Counting through a relationship", xp:100,

  { title:"Filter Context and CALCULATE", desc:"Understand how visuals create filter context, and use CALCULATE and ALL to change it.",

      {h:"In SQL terms", b:["Rows of a visual are like GROUP BY","Slicers and filters are like WHERE"], code:"SELECT c.sector, SUM(f.fee_usd)\nFROM fact_fees f JOIN dim_client c ON ...\nWHERE <slicers>\nGROUP BY c.sector"},

      instr:["Join `fact_fees` to `dim_project` and `dim_office`.","Return each `practice_area` with `emea_fees`: `SUM(CASE WHEN o.region = 'EMEA' THEN f.fee_usd END)`.","Sort by `practice_area`."],

      solution:"-- Standard Value = SUMX ( fact_fees, fact_fees[hours] * RELATED ( dim_office[bill_rate] ) )\nSELECT SUM(f.hours * o.bill_rate) AS standard_value\nFROM fact_fees f\nJOIN dim_office o ON f.office_id = o.office_id;\n"},

      context:"Some projects don't have a gross square footage yet: it's either `NULL` or `0`. `DIVIDE` returns BLANK for those instead of an error:\n\n`Fee Per SF = DIVIDE ( [Total Fees], SUM ( dim_project[gross_sf] ) )`\n\nIn SQL, `NULLIF(x, 0)` turns a zero into `NULL`, and dividing by `NULL` gives `NULL`.",
      instr:["For each project, return `project_name` and `fee_per_sf`: its total `fee_usd` times `1.0` divided by `NULLIF(p.gross_sf, 0)`, rounded to 2 decimals.","Sort by `project_name`."],

      starter:"-- Fee Per SF = DIVIDE ( [Total Fees], SUM ( dim_project[gross_sf] ) )\n",
      solution:"-- Fee Per SF = DIVIDE ( [Total Fees], SUM ( dim_project[gross_sf] ) )\nSELECT p.project_name,\n       ROUND(SUM(f.fee_usd) * 1.0 / NULLIF(p.gross_sf, 0), 2) AS fee_per_sf\nFROM fact_fees f\nJOIN dim_project p ON f.project_id = p.project_id\nGROUP BY p.project_id, p.project_name, p.gross_sf\nORDER BY p.project_name;\n"},

      solution:"-- Office Rank = RANKX ( ALL ( dim_office[office_name] ), [Total Fees] )\nSELECT o.office_name,\n       SUM(f.fee_usd) AS total_fees,\n       RANK() OVER (ORDER BY SUM(f.fee_usd) DESC) AS office_rank\nFROM fact_fees f\nJOIN dim_office o ON f.office_id = o.office_id\nGROUP BY o.office_name\nORDER BY office_rank;\n"},

  { title:"Medallion Architecture", desc:"Take raw timesheet data from bronze to silver to gold with SQL: profile it, deduplicate it, standardize it and aggregate it.",

    {type:"code", title:"Profile the bronze table", xp:100,
      context:"Always profile raw data before cleaning it. A quick count of rows and distinct values tells you a lot. If the firm only has three offices in this export, how many spellings of office names are there?",
      instr:["Return one row with `row_count`, the number of rows in `bronze_timesheets`, and `office_spellings`, the number of distinct `office` values."],

      starter:"-- Profile bronze_timesheets\n",
      solution:"-- Profile bronze_timesheets\nSELECT COUNT(*) AS row_count, COUNT(DISTINCT office) AS office_spellings\nFROM bronze_timesheets;\n"},
    {type:"code", title:"Find duplicate rows", xp:100,
      context:"Exports often send the same record twice. A row is a duplicate when every column matches another row.",
      instr:["Group by all five columns and return groups with more than one row.","Return `staff_email`, `work_date` and `copies` (the row count), sorted by `staff_email` then `work_date`."],
      hint:"`GROUP BY staff_email, project_code, office, work_date, hours HAVING COUNT(*) > 1`.",
      starter:"-- Find exact duplicates\n",
      solution:"-- Find exact duplicates\nSELECT staff_email, work_date, COUNT(*) AS copies\nFROM bronze_timesheets\nGROUP BY staff_email, project_code, office, work_date, hours\nHAVING COUNT(*) > 1\nORDER BY staff_email, work_date;\n"},
    {type:"code", title:"Standardize office names", xp:100,
      context:"The same office is spelled several ways: extra spaces, lowercase, and abbreviations like `NYC` and `LDN`. Map them to one clean name with `CASE`, after normalizing with `LOWER(TRIM(office))`.",
      instr:["Return each distinct raw `office` value as `raw_office` and its clean name as `office_name`.","Map `new york` and `nyc` to `New York`, `london` and `ldn` to `London`, and `tokyo` to `Tokyo`.","Sort by `raw_office`."],
      hint:"`CASE WHEN LOWER(TRIM(office)) IN ('new york', 'nyc') THEN 'New York' WHEN ... END AS office_name`.",
      starter:"-- Map raw office spellings to clean names\n",
      solution:"-- Map raw office spellings to clean names\nSELECT DISTINCT office AS raw_office,\n       CASE\n         WHEN LOWER(TRIM(office)) IN ('new york', 'nyc') THEN 'New York'\n         WHEN LOWER(TRIM(office)) IN ('london', 'ldn') THEN 'London'\n         WHEN LOWER(TRIM(office)) = 'tokyo' THEN 'Tokyo'\n       END AS office_name\nFROM bronze_timesheets\nORDER BY raw_office;\n"},

      starter:"-- Convert hours to numbers and drop invalid rows\n",
      solution:"-- Convert hours to numbers and drop invalid rows\nSELECT staff_email, work_date, CAST(hours AS REAL) AS hours\nFROM bronze_timesheets\nWHERE CAST(hours AS REAL) > 0\nORDER BY staff_email, work_date, hours;\n"},
    {type:"code", title:"Build the silver table", xp:100,
      context:"Now put it all together. In Fabric you'd save this result as a silver Delta table. Notice that some emails are uppercase: normalize them with `LOWER(TRIM(...))` too.",
      instr:["Select `DISTINCT` rows with these columns: `LOWER(TRIM(staff_email))` as `staff_email`, `project_code`, the clean `office_name` from the previous exercise, `work_date`, and `CAST(hours AS REAL)` as `hours`.","Keep only rows with hours greater than 0.","Sort by `staff_email`, then `work_date`, then `project_code`."],
      hint:"Combine your CASE expression and your WHERE clause from the last two exercises, and add DISTINCT.",
      starter:"-- Build the silver timesheets\n",
      solution:"-- Build the silver timesheets\nSELECT DISTINCT\n       LOWER(TRIM(staff_email)) AS staff_email,\n       project_code,\n       CASE\n         WHEN LOWER(TRIM(office)) IN ('new york', 'nyc') THEN 'New York'\n         WHEN LOWER(TRIM(office)) IN ('london', 'ldn') THEN 'London'\n         WHEN LOWER(TRIM(office)) = 'tokyo' THEN 'Tokyo'\n       END AS office_name,\n       work_date,\n       CAST(hours AS REAL) AS hours\nFROM bronze_timesheets\nWHERE CAST(hours AS REAL) > 0\nORDER BY staff_email, work_date, project_code;\n"},
    {type:"code", title:"Gold: hours by office", xp:100,
      context:"Gold tables answer business questions directly. Your silver query is provided as a CTE called `silver`.",
      instr:["From `silver`, return each `office_name` with `total_hours` (sum of hours) and `staff` (distinct count of `staff_email`).","Sort by `total_hours` from highest to lowest."],
      hint:"`SELECT office_name, SUM(hours) AS total_hours, COUNT(DISTINCT staff_email) AS staff FROM silver GROUP BY office_name ORDER BY total_hours DESC`.",
      starter:"WITH silver AS (\n  SELECT DISTINCT\n         LOWER(TRIM(staff_email)) AS staff_email,\n         project_code,\n         CASE\n           WHEN LOWER(TRIM(office)) IN ('new york', 'nyc') THEN 'New York'\n           WHEN LOWER(TRIM(office)) IN ('london', 'ldn') THEN 'London'\n           WHEN LOWER(TRIM(office)) = 'tokyo' THEN 'Tokyo'\n         END AS office_name,\n         work_date,\n         CAST(hours AS REAL) AS hours\n  FROM bronze_timesheets\n  WHERE CAST(hours AS REAL) > 0\n)\n-- Aggregate silver into a gold table\nSELECT *\nFROM silver;\n",
      solution:"WITH silver AS (\n  SELECT DISTINCT\n         LOWER(TRIM(staff_email)) AS staff_email,\n         project_code,\n         CASE\n           WHEN LOWER(TRIM(office)) IN ('new york', 'nyc') THEN 'New York'\n           WHEN LOWER(TRIM(office)) IN ('london', 'ldn') THEN 'London'\n           WHEN LOWER(TRIM(office)) = 'tokyo' THEN 'Tokyo'\n         END AS office_name,\n         work_date,\n         CAST(hours AS REAL) AS hours\n  FROM bronze_timesheets\n  WHERE CAST(hours AS REAL) > 0\n)\n-- Aggregate silver into a gold table\nSELECT office_name, SUM(hours) AS total_hours, COUNT(DISTINCT staff_email) AS staff\nFROM silver\nGROUP BY office_name\nORDER BY total_hours DESC;\n"},
    {type:"mcq", title:"Which layer for reports?",

const PYRE = /(#.*)|("""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(\b\d+(?:\.\d+)?\b)|(\b(?:False|None|True|and|as|assert|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield)\b)|(\b[A-Za-z_]\w*(?=\())/g;
const SQLRE = /(--.*)|('(?:''|[^'])*'?)|(\b\d+(?:\.\d+)?\b)|(\b(?:SELECT|FROM|WHERE|AND|OR|NOT|AS|DISTINCT|GROUP|BY|ORDER|HAVING|LIMIT|OFFSET|ASC|DESC|LIKE|IN|IS|NULL|BETWEEN|JOIN|INNER|LEFT|RIGHT|FULL|OUTER|ON|USING|UNION|ALL|CASE|WHEN|THEN|ELSE|END|CREATE|TABLE|INSERT|INTO|VALUES|UPDATE|SET|DELETE|DROP|WITH)\b)|(\b(?:COUNT|SUM|AVG|MIN|MAX|ROUND|UPPER|LOWER|LENGTH|COALESCE|CAST|ABS|SUBSTR)\b(?=\s*\())/gi;
const HTMLRE = /(<!--[\s\S]*?(?:-->|$)|\/\*[\s\S]*?(?:\*\/|$))|("[^"\n]*"?)|(&#?\w+;|#[0-9a-fA-F]{3,8}\b|\b\d+(?:\.\d+)?(?:px|rem|em|%)?)|(<\/?[A-Za-z][\w-]*|\/?>|<!DOCTYPE)|(\b[a-zA-Z-]+(?=\s*=)|\b[a-z-]+(?=\s*:\s*[^;{}]*;))/gi;
function hl(code, lang) {
  const re = lang === "sql" ? SQLRE : lang === "html" ? HTMLRE : PYRE; re.lastIndex = 0;
  let out = "", last = 0, m;
  const cls = ["", "c", "s", "n", "k", "f"];
  while ((m = re.exec(code))) {
    if (m[0] === "") { re.lastIndex++; continue; }
    out += esc(code.slice(last, m.index));

    last = m.index + m[0].length;

}

function makeEditor(host, lang, value, hooks) {

  ta.value = value;

    gut.textContent = g;
  }
  function ins(text) {

    const y = 12 + line * 21, x = col * 8.1 + 62;
    if (y < box.scrollTop) box.scrollTop = y - 10;
    else if (y + 30 > box.scrollTop + box.clientHeight) box.scrollTop = y + 40 - box.clientHeight;
    if (x > box.scrollLeft + box.clientWidth - 30) box.scrollLeft = x - box.clientWidth + 60;

  ta.addEventListener("input", () => { sync(); hooks.onChange && hooks.onChange(ta.value); keepCaret(); });
  ta.addEventListener("keydown", e => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key === "Enter") { e.preventDefault(); if (e.shiftKey) hooks.onSubmit && hooks.onSubmit(); else hooks.onRun && hooks.onRun(); return; }
    if (e.key === "Tab") { e.preventDefault(); ins("    "); return; }
    if (e.key === "Enter") {
      e.preventDefault();
      const start = ta.value.lastIndexOf("\n", ta.selectionStart - 1) + 1;
      const line = ta.value.slice(start, ta.selectionStart);
      let ind = line.match(/^\s*/)[0];
      if (lang === "py" && /:\s*$/.test(line)) ind += "    ";
      if (lang === "html" && /<(?!\/)(?!(?:br|img|input|meta|link|hr)\b)[a-zA-Z][^>]*[^/]>\s*$|\{\s*$/.test(line)) ind += "  ";

let P = null;

  return pool;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pagePractice() {

function answerPractice(i) {

  const last = P.i === P.qs.length - 1;
  $("#pfb").innerHTML = `<div class="fb ${right ? "good" : "bad"}"><b>${right ? "Correct! +10 XP" : "Not quite."}</b>${q.fb ? inline(q.fb[i]) : right ? "Nice work." : "The correct answer is highlighted in green."}</div>

}

      ${x.b ? `<ul>${x.b.map(b => `<li>${inline(b)}</li>`).join("")}</ul>` : ""}
      ${x.code ? `<pre>${hl(x.code, langOf(L.c))}</pre>` : ""}
      ${x.out ? `<pre class="out">${esc(x.out)}</pre>` : ""}`;
    $$(".dots i").forEach((d, i) => d.classList.toggle("on", i === L.slide));
    $("#sprev").disabled = L.slide === 0;
    const last = L.slide === s.length - 1;
    $("#snext").innerHTML = last ? (L.solved ? "Continue" + I.right : "Got it! +50 XP") : "Next" + I.right;
  };
  $("#sprev").onclick = () => { if (L.slide > 0) { L.slide--; draw(); } };
  $("#snext").onclick = () => {
    if (L.slide < s.length - 1) { L.slide++; draw(); return; }
    const got = complete(); if (got > 0) toast(I.bolt.replace("<svg", '<svg width="16" height="16"') + " +" + got + " XP");
    goNext();
  };
  L.keys = e => { if (e.key === "ArrowRight") $("#snext").click(); if (e.key === "ArrowLeft") $("#sprev").click(); };
  draw();
}

function renderMCQ() {
  const l = L.l;
  $("#lbody").innerHTML = `<div style="flex:1;overflow:auto"><div class="mcq">
    <div class="ex-h">${I.mcq.replace("<svg", '<svg width="15" height="15"')} Multiple choice exercise <span class="xpb" style="margin-left:auto">${L.solved ? "Completed" : L.xp + " XP"}</span></div>
    <h2 style="font-size:24px;margin:10px 0 12px">${esc(l.title)}</h2>
    <div class="prose">${md(l.context)}</div>
    <h3 style="font-size:17px;margin:20px 0 14px">${inline(l.q)}</h3>
    ${l.code ? `<div class="qcode">${hl(l.code, langOf(L.c))}</div>` : ""}
    <div id="opts">${l.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="r"></span><span>${inline(o)}</span><i class="k">${i + 1}</i></button>`).join("")}</div>
    <div style="margin-top:14px;display:flex;gap:10px"><button class="btn pri" id="msub" disabled>Submit Answer</button></div>
    <div id="mfb"></div></div></div>`;
  const pick = i => { if (L.mDone) return; L.sel = i; $$(".opt").forEach((b, j) => b.classList.toggle("sel", j === i)); $("#msub").disabled = false; };
  $$(".opt").forEach(b => b.onclick = () => pick(+b.dataset.i));
  $("#msub").onclick = () => {
    if (L.sel === null) return;
    const i = L.sel, ok = i === l.answer;
    if (L.mDone) { goNext(); return; }
    $$(".opt")[i].classList.add(ok ? "right" : "wrong");
    if (ok) {
      L.mDone = true;
      const got = complete();
      $$(".opt").forEach(b => b.disabled = true);
      $("#mfb").innerHTML = `<div class="fb good"><b>${got > 0 ? "Well done! +" + got + " XP" : "Well done!"}</b>${inline(l.fb[i])}</div>`;
      $("#msub").textContent = "Continue"; $("#msub").classList.remove("pri"); $("#msub").classList.add("ok");
    } else {
      L.wrong++; if (!L.solved) { L.xp = Math.max(15, 50 - 15 * L.wrong); updXP(); }
      $("#mfb").innerHTML = `<div class="fb bad"><b>Incorrect.</b>${inline(l.fb[i])}</div>`;
    }
  };
  L.keys = e => { if (e.target.tagName === "INPUT") return; const n = +e.key; if (n >= 1 && n <= l.options.length) pick(n - 1); if (e.key === "Enter" && !$("#msub").disabled) $("#msub").click(); };
}

function renderCode() {
  const l = L.l, c = L.c;
  $("#lbody").innerHTML = `
    <div class="lleft">
      <div class="ex-h">${I.code.replace("<svg", '<svg width="15" height="15"')} Exercise</div>
      <h2>${esc(l.title)}</h2>
      <div class="prose">${md(l.context)}</div>
      <div class="instr">
        <div class="instr-h"><span>Instructions</span><span class="xpb" id="ixp"></span></div>
        <ul>${l.instr.map(x => `<li>${inline(x)}</li>`).join("")}</ul>
        <div class="acts" id="acts"></div>
        <div id="hintslot"></div>
      </div>
      <div id="cfb"></div>
    </div>
    <div class="lright" id="ide"></div>`;
  const updI = () => {
    $("#ixp").textContent = L.solved ? "Completed" : L.xp + " XP";
    $("#acts").innerHTML = !L.hint
      ? `<button class="btn sm" id="hbtn">${I.bulb}Take Hint ${L.solved ? "" : "(-30 XP)"}</button>`
      : !L.ans ? `<button class="btn sm" id="abtn">${I.eye}Show Answer ${L.solved ? "" : "(-40 XP)"}</button>` : "";
    if ($("#hbtn")) $("#hbtn").onclick = () => { L.hint = true; if (!L.solved) L.xp -= 30; $("#hintslot").innerHTML = `<div class="hintbox">${inline(l.hint)}</div>`; updI(); updXP(); };
    if ($("#abtn")) $("#abtn").onclick = () => { L.ans = true; if (!L.solved) L.xp -= 40; ide.ed.set(l.solution); updI(); updXP(); toast("Solution loaded into the editor"); };
  };
  updI();
  const ide = IDE($("#ide"), {
    lang: langOf(c),
    value: S.drafts[L.key] || l.starter,
    pkgs: c.pkgs, pre: c.pre || "", solution: l.solution, check: l.check || "", seed: c.seed, schema: c.schema,
    onChange: v => { S.drafts[L.key] = v; saveSoon(); },
    onReset: () => l.starter,
    onSubmit: res => {
      if (res.fatal) return;
      if (res.ok) {
        const got = complete();
        $("#cfb").innerHTML = `<div class="fb good"><b>${got > 0 ? "Great work! +" + got + " XP" : "Correct!"}</b>${["Well done.", "You nailed it.", "That's exactly right.", "Nice job."][Math.floor(Math.random() * 4)]}
          <div style="margin-top:12px"><button class="btn ok sm" id="cnext">Continue${I.right}</button></div></div>`;
        $("#cnext").onclick = goNext;
        updI();
      } else {
        $("#cfb").innerHTML = `<div class="fb bad"><b>Not quite right.</b>${inline(res.msg || "Check the instructions and try again.")}</div>`;
      }
      $("#cfb").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  });
  L.keys = null;
}

function showCert(id, fresh) {
  const c = courseById(id);
  const date = S.certs[id] || dkey(new Date());
  const d = new Date(date + "T12:00:00");
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box">
    ${fresh ? `<div style="color:var(--ok);width:44px;margin:0 auto">${I.trophy}</div><h2 style="font-size:24px;margin-top:8px">Course complete!</h2><p class="muted" style="margin:6px 0 0">You finished every exercise in this course.</p>` : ""}
    <div class="cert"><div class="ex-h" style="justify-content:center">Statement of Accomplishment</div>
      <div class="cn">${esc(c.title)}</div>
      <div class="muted" style="font-size:13.5px">Completed ${d.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })} · ${c.hours} hours · ${fmtNum(flat(c).reduce((a, x) => a + (S.done[x.key] || 0), 0))} XP earned</div></div>
    <div style="display:flex;gap:10px;justify-content:center"><button class="btn pri" id="mclose">Done</button>${fresh ? `<button class="btn" onclick="this.closest('.modal').remove();location.hash='courses'">Browse courses</button>` : ""}</div></div>`;
  document.body.appendChild(m);
  $("#mclose", m).onclick = () => m.remove();
  m.onclick = e => { if (e.target === m) m.remove(); };
}

/* ===== Router ===== */
function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || "home";
  const lm = h.match(/^l-(.+)-(\d+)-(\d+)$/);
  if (lm) { openLesson(lm[1], +lm[2] - 1, +lm[3] - 1); return; }
  if (L) closeLesson();
  window.scrollTo(0, 0);
  if (h === "courses") pageCourses();
  else if (h.startsWith("course-")) pageCourse(h.slice(7));
  else if (h === "tracks") pageTracks();
  else if (h === "practice") pagePractice();
  else if (h === "workspace") pageWorkspace();
  else pageHome();
}
document.addEventListener("keydown", e => {
  if (!L || !L.keys) return;
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  L.keys(e);
});
window.addEventListener("hashchange", route);
updateTop();
route();

document.getElementById("mnav").innerHTML = [["home", "Home", "home"], ["courses", "Courses", "grid"], ["tracks", "Tracks", "route"], ["practice", "Practice", "target"], ["workspace", "Workspace", "term"]].map(([h,t,i]) => `<a href="#${h}" data-n="${h}">${I[i]}${t}</a>`).join("");
{ const on = $(".nav a.on"); if (on) setNav(on.dataset.n); }
</script>
