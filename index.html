<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datum: Learn Data Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{
  --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e5e7eb; --line2:#eef0f3; --soft:#f8fafc;
  --acc:#2457f5; --acc-soft:#eef3ff; --ok:#16a34a; --ok-soft:#ecfdf3; --bad:#dc2626; --bad-soft:#fef2f2;
  --warn:#d97706; --py:#2457f5; --sql:#c2410c; --html:#0f766e; --pbi:#a16207; --fab:#0e7490; --r:10px;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:var(--acc);text-decoration:none}
code{font-family:var(--mono);font-size:.88em;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:5px;padding:.05em .35em;color:#0f172a}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.hidden{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);height:60px;display:flex;align-items:center;padding:0 24px;gap:28px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;color:var(--ink)}
.logo svg{display:block}
.nav{display:flex;gap:4px;flex:1}
.nav a{color:var(--ink2);padding:8px 12px;border-radius:8px;font-weight:500;font-size:14px}
.nav a:hover{background:var(--soft)}
.nav a.on{color:var(--acc);background:var(--acc-soft)}
.stats{display:flex;gap:10px;align-items:center}
.pill{white-space:nowrap;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.pill svg{width:15px;height:15px}

/* layout */
.page{max-width:1160px;margin:0 auto;padding:32px 24px 80px}
.h1{font-size:28px;font-weight:700}
.sub{color:var(--muted);margin-top:6px}
.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.sec-h h2{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;transition:background .12s,border-color .12s}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#1c47d6}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.tag.py{color:var(--py);background:#eef3ff;border-color:#dbe4ff}
.tag.pbi{color:var(--pbi);background:#fefce8;border-color:#fde68a}
.tag.fab{color:var(--fab);background:#ecfeff;border-color:#a5f3fc}
.tag.html{color:var(--html);background:#ecfdf5;border-color:#ccfbf1}
.tag.sql{color:var(--sql);background:#fff4ed;border-color:#ffe0cc}
.muted{color:var(--muted)}
.bar{height:6px;background:var(--line2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.bar.ok>i{background:var(--ok)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.cont{display:flex;gap:18px;align-items:center}
.cont .ic{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;flex:none}
.ring{position:relative;width:110px;height:110px;margin:4px auto 10px}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:700;font-size:20px;line-height:1.1}
.ring .t small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.week{display:flex;justify-content:space-between;margin-top:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.week i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:block}
.week i.on{background:var(--acc);border-color:var(--acc)}

/* course cards */
.cc{display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.cc:hover{border-color:#cbd5e1;box-shadow:0 4px 18px rgba(15,23,42,.06)}
.cc h3{font-size:16.5px;line-height:1.3}
.cc p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
.cc .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.cc .meta span{display:flex;gap:5px;align-items:center;white-space:nowrap}
.cc .meta svg{width:14px;height:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 18px}
.search{flex:1;min-width:220px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit}
.search:focus,.chip:focus{outline:2px solid var(--acc-soft);border-color:var(--acc)}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* course page */
.chero{border-bottom:1px solid var(--line);background:#fff}
.chero .in{max-width:1160px;margin:0 auto;padding:36px 24px 30px;display:grid;grid-template-columns:1fr 300px;gap:40px}
.chero h1{font-size:32px;margin:12px 0 10px}
.chero p{color:var(--ink2);margin:0;max-width:640px}
.facts{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
.facts div{font-size:13px;color:var(--muted)}
.facts b{display:block;font-size:17px;color:var(--ink)}
.side{border:1px solid var(--line);border-radius:var(--r);padding:20px;align-self:start}
.side h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.chap{border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.chap-h{display:flex;gap:16px;padding:20px;cursor:pointer;align-items:flex-start}
.chap-n{width:34px;height:34px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:700;flex:none}
.chap-n.done{background:var(--ok);color:#fff}
.chap-h h3{font-size:17px}
.chap-h p{margin:4px 0 0;color:var(--muted);font-size:14px}
.chap-h .chev{margin-left:auto;transition:transform .2s;color:var(--muted);flex:none}
.chap.open .chev{transform:rotate(180deg)}
.lessons{display:none;border-top:1px solid var(--line2)}
.chap.open .lessons{display:block}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 20px 11px 70px;cursor:pointer;font-size:14px;border-top:1px solid var(--line2)}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--soft)}
.lrow .li{width:22px;height:22px;display:grid;place-items:center;color:var(--muted)}
.lrow .li svg{width:17px;height:17px}
.lrow .xp{margin-left:auto;font-size:12.5px;color:var(--muted)}
.lrow .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.lrow.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.lrow .ck svg{width:11px;height:11px}

/* lesson shell */
.lesson{position:fixed;inset:0;z-index:40;background:#fff;display:flex;flex-direction:column}
.lbar{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 14px;flex:none}
.lbar .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbar .seg{display:flex;gap:4px;flex:1;max-width:420px;margin:0 auto}
.lbar .seg i{flex:1;height:6px;border-radius:99px;background:var(--line2);cursor:pointer}
.lbar .seg i.d{background:var(--ok)}
.lbar .seg i.c{background:var(--acc)}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{background:var(--soft)}
.iconbtn svg{width:17px;height:17px}
.rt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.rt i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.rt.ready i{background:var(--ok)}
.lbody{flex:1;display:flex;min-height:0}
.lleft{width:40%;min-width:340px;max-width:560px;border-right:1px solid var(--line);overflow:auto;padding:26px 28px 40px}
.lright{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
.ex-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.lleft h2{font-size:22px;margin:8px 0 14px}
.prose p{margin:0 0 12px;color:var(--ink2)}
.prose ul{margin:0 0 12px;padding-left:20px;color:var(--ink2)}
.prose li{margin:3px 0}
.instr{border:1px solid var(--line);border-radius:var(--r);margin-top:18px;overflow:hidden}
.instr-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--soft);border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.xpb{font-size:12px;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:6px;padding:2px 8px}
.instr ul{margin:0;padding:14px 16px 6px 34px}
.instr li{margin:0 0 9px;color:var(--ink2)}
.instr .acts{padding:4px 16px 16px;display:flex;gap:8px;flex-wrap:wrap}
.hintbox{margin:0 16px 16px;border-left:3px solid var(--warn);background:#fffbeb;padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px;color:#78350f}
.fb{margin-top:16px;border-radius:var(--r);padding:14px 16px;font-size:14px}
.fb.bad{background:var(--bad-soft);border:1px solid #fecaca;color:#7f1d1d}
.fb.good{background:var(--ok-soft);border:1px solid #bbf7d0;color:#14532d}
.fb b{display:block;margin-bottom:4px}

/* editor */
.edhead{display:flex;align-items:center;border-bottom:1px solid var(--line);height:44px;padding:0 10px 0 0;flex:none}
.tab{height:100%;display:flex;align-items:center;gap:7px;padding:0 16px;font-size:13px;font-weight:600;color:var(--muted);border:0;border-bottom:2px solid transparent;background:none}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
.edhead .sp{flex:1}
.edwrap{flex:1;min-height:120px;position:relative}
.ed{position:absolute;inset:0;overflow:auto;font:13.5px/21px var(--mono);background:#fff}
.ed .in{position:relative;display:flex;min-height:100%;min-width:100%;width:max-content}
.ed .gut{position:sticky;left:0;z-index:2;background:#fff;color:#94a3b8;text-align:right;padding:12px 10px 40px 12px;user-select:none;border-right:1px solid var(--line2);min-width:46px;white-space:pre}
.ed .code{position:relative;flex:1}
.ed pre,.ed textarea{margin:0;padding:12px 16px 40px;font:inherit;white-space:pre;tab-size:4;border:0;letter-spacing:0}
.ed pre{pointer-events:none;color:var(--ink)}
.ed textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;background:transparent;color:transparent;caret-color:var(--ink);outline:none;overflow:hidden}
.ed textarea::selection{background:#c7d7fe;color:transparent}
.k{color:#7c3aed}.s{color:#047857}.n{color:#c2410c}.c{color:#94a3b8;font-style:italic}.f{color:#2457f5}
.runbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);flex:none}
.runbar .sp{flex:1}
.kbd{font-size:11.5px;color:var(--muted)}
.console{height:38%;min-height:150px;border-top:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.cbody{flex:1;overflow:auto;font:13px/1.55 var(--mono);padding:10px 14px;white-space:pre-wrap;color:var(--ink2)}
.cbody .err{color:var(--bad)}
.cbody .inp{color:var(--acc)}
.cbody .note{color:var(--muted);font-family:Inter,sans-serif;font-size:13px}
.cin{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line2);padding:6px 14px;font:13px var(--mono)}
.cin span{color:var(--acc)}
.cin input{flex:1;border:0;outline:none;font:inherit;background:transparent}
.plots{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px;align-items:center}
.plots img{max-width:100%;border:1px solid var(--line2);border-radius:6px}
table.res{border-collapse:collapse;font:12.5px var(--mono);min-width:100%}
table.res th{position:sticky;top:0;background:var(--soft);text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);font-weight:600;color:var(--ink)}
table.res td{padding:6px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.res td.null{color:#94a3b8;font-style:italic}
.tblwrap{flex:1;overflow:auto}
.schema{padding:12px 14px;font-size:13px}
.schema table{border-collapse:collapse}
.schema td{padding:3px 18px 3px 0;font-family:var(--mono);font-size:12.5px}
.schema td:last-child{color:var(--muted)}

/* slides */
.slides{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;background:var(--soft);min-height:0;overflow:auto}
.slide{width:100%;max-width:860px;aspect-ratio:16/9;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.06);padding:44px 52px;display:flex;flex-direction:column;overflow:auto}
.slide h3{font-size:28px;margin-bottom:18px}
.slide ul{margin:0 0 16px;padding-left:22px;font-size:17px;color:var(--ink2)}
.slide li{margin:6px 0}
.slide pre{margin:0;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:14px 16px;font:14px/1.6 var(--mono);overflow:auto}
.slide .out{margin-top:8px;background:#fff;border-style:dashed;color:var(--muted)}
.snav{display:flex;align-items:center;gap:14px;margin-top:18px}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:#cbd5e1}
.dots i.on{background:var(--acc)}

/* mcq */
.mcq{max-width:720px;margin:0 auto;padding:40px 24px 60px;width:100%}
.opt{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:10px;cursor:pointer;font-size:15px;background:#fff;width:100%;text-align:left}
.opt:hover{border-color:#cbd5e1}
.opt .r{width:18px;height:18px;border-radius:50%;border:1.5px solid #cbd5e1;flex:none}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.sel .r{border:5px solid var(--acc)}
.opt.wrong{border-color:#fecaca;background:var(--bad-soft)}
.opt.right{border-color:#86efac;background:var(--ok-soft)}
.opt .k{width:22px;height:22px;border-radius:6px;background:var(--soft);border:1px solid var(--line);font-size:12px;display:grid;place-items:center;color:var(--muted);font-style:normal;flex:none;margin-left:auto}
.qcode{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:12px 16px;font:14px/1.6 var(--mono);margin:0 0 18px;white-space:pre}

/* done overlay */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:500;z-index:80;transition:all .25s;pointer-events:none;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:70;display:grid;place-items:center;padding:20px}
.modal .box{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:30px;text-align:center}
.cert{border:1px solid var(--line);border-radius:12px;padding:28px;margin:18px 0;text-align:center}
.cert .cn{font-size:22px;font-weight:700;margin:6px 0}
.outline{position:fixed;top:54px;left:0;bottom:0;width:380px;max-width:92vw;background:#fff;border-right:1px solid var(--line);z-index:45;overflow:auto;padding:18px;box-shadow:12px 0 30px rgba(15,23,42,.08)}
.outline h4{margin:16px 0 6px;font-size:13px;color:var(--muted)}
.outline .lrow{padding-left:8px}

/* practice */
.pq{max-width:680px}
.empty{text-align:center;color:var(--muted);padding:40px}
.wsgrid{display:flex;border:1px solid var(--line);border-radius:var(--r);height:620px;overflow:hidden;margin-top:20px}
.wsgrid .lright{position:relative}

@media (max-width: 860px){
  .nav{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .two,.chero .in{grid-template-columns:1fr}
  .lbody{flex-direction:column;overflow:auto}
  .lleft{width:100%;max-width:none;min-width:0;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .lright{min-height:560px}
  .slide{padding:24px;aspect-ratio:auto}
  .lbar .seg{display:none}
  .lbar .t{display:none}
  .lbar .rt{font-size:0;gap:0;margin-left:auto}
  .lbar{gap:8px}
  .lrow{padding-left:20px}
  .top{padding:0 14px;gap:12px}
  .mnav{display:flex!important}
}
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;justify-content:space-around;padding:6px 0}
.mnav a{font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px}
.mnav a.on{color:var(--acc)}
.mnav svg{width:20px;height:20px}

.opt:disabled{color:inherit;cursor:default}

iframe.preview{flex:1;width:100%;border:0;background:#fff;display:block}
</style></head>
<body>
<header class="top">
  <a class="logo" href="#home"><svg width="28" height="28" viewBox="0 0 28 28"><rect width="28" height="28" rx="7" fill="#2457f5"/><rect x="7" y="15" width="3.2" height="6" rx="1.2" fill="#fff"/><rect x="12.4" y="10" width="3.2" height="11" rx="1.2" fill="#fff"/><rect x="17.8" y="6" width="3.2" height="15" rx="1.2" fill="#fff" opacity=".7"/></svg>Datum</a>
  <nav class="nav"><a href="#home" data-n="home">Home</a><a href="#courses" data-n="courses">Courses</a><a href="#tracks" data-n="tracks">Tracks</a><a href="#practice" data-n="practice">Practice</a><a href="#workspace" data-n="workspace">Workspace</a></nav>
  <div class="stats"><span class="pill" id="streakPill" title="Day streak"></span><span class="pill" id="xpPill" title="Total XP"></span></div>
</header>
<main id="app"></main>
<div id="lesson" class="lesson hidden"></div>
<nav class="mnav" id="mnav"></nav>

const HARNESS = "import sys, io, json, traceback, warnings, base64, linecache\nwarnings.filterwarnings(\"ignore\")\n\nclass CheckFail(Exception):\n    pass\n\n_SHELL = {\"__name__\": \"__main__\"}\n_WS_DB = None\nSEED_SQL = \"\"\n\n\ndef _clean_tb(e):\n    tb = traceback.format_exception(type(e), e, e.__traceback__)\n    keep = []\n    for part in tb:\n        if part.startswith(\"Traceback\"):\n            keep.append(part)\n            continue\n        if part.lstrip().startswith(\"File \"):\n            if 'File \"script.py\"' in part or 'File \"<shell>\"' in part:\n                keep.append(part)\n            continue\n        keep.append(part)\n    if len(keep) == 2 and keep[0].startswith(\"Traceback\"):\n        keep = keep[1:]\n    return \"\".join(keep)\n\n\ndef _exec(code, ns, fname=\"script.py\"):\n    buf = io.StringIO()\n    old_out, old_err = sys.stdout, sys.stderr\n    sys.stdout = buf\n    sys.stderr = buf\n    err = None\n    linecache.cache[fname] = (len(code), None, [l + \"\\n\" for l in code.splitlines()], fname)\n    try:\n        exec(compile(code, fname, \"exec\"), ns)\n    except SyntaxError as e:\n        err = \"\".join(traceback.format_exception_only(type(e), e))\n    except Exception as e:\n        err = _clean_tb(e)\n    finally:\n        sys.stdout, sys.stderr = old_out, old_err\n    return buf.getvalue(), err\n\n\ndef _plt():\n    return sys.modules.get(\"matplotlib.pyplot\")\n\n\ndef _mpl_setup():\n    import matplotlib\n    matplotlib.use(\"Agg\")\n    import matplotlib.pyplot as plt\n    plt.show = lambda *a, **k: None\n    plt.rcParams[\"figure.figsize\"] = (6.4, 4.2)\n\n\ndef _fignums():\n    plt = _plt()\n    return list(plt.get_fignums()) if plt else []\n\n\ndef _render(nums):\n    plt = _plt()\n    out = []\n    if not plt:\n        return out\n    for n in nums:\n        f = plt.figure(n)\n        b = io.BytesIO()\n        f.savefig(b, format=\"png\", dpi=96, bbox_inches=\"tight\", facecolor=\"white\")\n        out.append(base64.b64encode(b.getvalue()).decode())\n    return out\n\n\ndef _close_all():\n    plt = _plt()\n    if plt:\n        plt.close(\"all\")\n\n\ndef _eq(a, b):\n    pd = sys.modules.get(\"pandas\")\n    np = sys.modules.get(\"numpy\")\n    if pd is not None:\n        if isinstance(a, pd.DataFrame) or isinstance(b, pd.DataFrame):\n            if not (isinstance(a, pd.DataFrame) and isinstance(b, pd.DataFrame)):\n                return False\n            try:\n                pd.testing.assert_frame_equal(a, b, check_dtype=False)\n                return True\n            except AssertionError:\n                return False\n        if isinstance(a, pd.Series) or isinstance(b, pd.Series):\n            if not (isinstance(a, pd.Series) and isinstance(b, pd.Series)):\n                return False\n            try:\n                pd.testing.assert_series_equal(a, b, check_dtype=False, check_names=False)\n                return True\n            except AssertionError:\n                return False\n        if isinstance(a, pd.Index):\n            return isinstance(b, pd.Index) and a.equals(b)\n    if np is not None and (isinstance(a, np.ndarray) or isinstance(b, np.ndarray)):\n        if not (isinstance(a, np.ndarray) and isinstance(b, np.ndarray)):\n            return False\n        try:\n            if a.shape != b.shape:\n                return False\n            if a.dtype.kind in \"fc\" or b.dtype.kind in \"fc\":\n                return bool(np.allclose(a, b, equal_nan=True))\n            return bool(np.array_equal(a, b))\n        except Exception:\n            return False\n    if isinstance(a, bool) or isinstance(b, bool):\n        return type(a) == type(b) and a == b\n    if isinstance(a, (int, float)) and isinstance(b, (int, float)):\n        return abs(a - b) < 1e-6 * max(1, abs(b))\n    if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):\n        return type(a) == type(b) and len(a) == len(b) and all(_eq(x, y) for x, y in zip(a, b))\n    try:\n        r = a == b\n        return bool(r) and type(a) == type(b)\n    except Exception:\n        return False\n\n\ndef run_py(code, pre, mode, sol, check):\n    global _SHELL\n    _close_all()\n    ns = {\"__name__\": \"__main__\"}\n    _exec(pre, ns, \"<pre>\")\n    out, err = _exec(code, ns)\n    _SHELL = ns\n    user_nums = _fignums()\n    res = {\"out\": out, \"err\": err, \"figs\": [], \"ok\": None, \"msg\": \"\"}\n    if mode == \"submit\":\n        if err:\n            res[\"ok\"] = False\n            res[\"msg\"] = \"Your code generated an error. Read the message in the shell, fix it and submit again.\"\n        else:\n            S = {\"__name__\": \"__main__\"}\n            _exec(pre, S, \"<pre>\")\n            sol_out, sol_err = _exec(sol, S, \"<sol>\")\n            sol_nums = [n for n in _fignums() if n not in user_nums]\n            plt = _plt()\n            U = ns\n\n            def need(cond, msg):\n                if not cond:\n                    raise CheckFail(msg)\n\n            def has_var(name, msg=None):\n                need(name in U, msg or \"Did you define the variable `%s`? Check the spelling.\" % name)\n\n            def eq_var(name, msg=None):\n                has_var(name)\n                need(_eq(U[name], S[name]), msg or \"The value of `%s` isn't quite right. Have another look at the instructions.\" % name)\n\n            def printed(s, msg):\n                need(s in out, msg)\n\n            def out_has_sol(msg=None):\n                for line in sol_out.strip().splitlines():\n                    line = line.strip()\n                    if line:\n                        need(line in out, msg or \"Your printout doesn't match what we expected. Did you print everything the instructions ask for?\")\n\n            def ufigs():\n                return [plt.figure(n) for n in user_nums] if plt else []\n\n            def sfigs():\n                return [plt.figure(n) for n in sol_nums] if plt else []\n\n            def uax(i=0):\n                fs = ufigs()\n                need(len(fs) > 0, \"We couldn't find a figure. Did you create one with `plt.subplots()`?\")\n                axs = fs[-1].axes\n                need(len(axs) > i, \"We couldn't find the Axes we expected. Check the call to `plt.subplots()`.\")\n                return axs[i]\n\n            env = {\"need\": need, \"has_var\": has_var, \"eq_var\": eq_var, \"printed\": printed,\n                   \"out_has_sol\": out_has_sol, \"U\": U, \"S\": S, \"out\": out, \"sol_out\": sol_out,\n                   \"ufigs\": ufigs, \"sfigs\": sfigs, \"uax\": uax, \"_eq\": _eq, \"code\": code}\n            try:\n                exec(check, env)\n                res[\"ok\"] = True\n            except CheckFail as e:\n                res[\"ok\"] = False\n                res[\"msg\"] = str(e)\n            except Exception as e:\n                res[\"ok\"] = False\n                res[\"msg\"] = \"Something isn't right yet. Compare your code with the instructions. (%s)\" % type(e).__name__\n            if plt:\n                for n in sol_nums:\n                    plt.close(n)\n    res[\"figs\"] = _render(user_nums)\n    return json.dumps(res)\n\n\ndef shell(code):\n    buf_code = code.strip()\n    if not buf_code:\n        return json.dumps({\"out\": \"\", \"err\": None, \"figs\": []})\n    before = _fignums()\n    try:\n        compiled = compile(buf_code, \"<shell>\", \"eval\")\n        is_expr = True\n        linecache.cache[\"<shell>\"] = (len(buf_code), None, [l + \"\\n\" for l in buf_code.splitlines()], \"<shell>\")\n    except SyntaxError:\n        is_expr = False\n    if is_expr:\n        bufo = io.StringIO()\n        old_out, old_err = sys.stdout, sys.stderr\n        sys.stdout = bufo\n        sys.stderr = bufo\n        err = None\n        try:\n            val = eval(compiled, _SHELL)\n            if val is not None:\n                print(repr(val))\n        except Exception as e:\n            err = _clean_tb(e)\n        finally:\n            sys.stdout, sys.stderr = old_out, old_err\n        out = bufo.getvalue()\n    else:\n        out, err = _exec(buf_code, _SHELL, \"<shell>\")\n    after = _fignums()\n    figs = _render(after) if after and (after != before or 'plt' in code or 'ax' in code or 'fig' in code) else []\n    return json.dumps({\"out\": out, \"err\": err, \"figs\": figs})\n\n\ndef _fresh_db(seed=None):\n    import sqlite3\n    db = sqlite3.connect(\":memory:\")\n    db.executescript(seed or SEED_SQL)\n    return db\n\n\ndef _q(db, sql):\n    cur = db.cursor()\n    cur.execute(sql)\n    cols = [d[0] for d in cur.description] if cur.description else []\n    rows = [list(r) for r in cur.fetchall()] if cur.description else []\n    db.commit()\n    return cols, rows\n\n\ndef _norm_rows(rows):\n    def v(x):\n        if isinstance(x, float):\n            return round(x, 6)\n        return x\n    return [[v(x) for x in r] for r in rows]\n\n\ndef run_sql(code, mode, sol, workspace=False, seed=None):\n    global _WS_DB\n    if workspace:\n        if _WS_DB is None:\n            _WS_DB = _fresh_db()\n        db = _WS_DB\n    else:\n        db = _fresh_db(seed)\n    res = {\"cols\": [], \"rows\": [], \"err\": None, \"ok\": None, \"msg\": \"\", \"count\": 0}\n    try:\n        cols, rows = _q(db, code)\n        res[\"cols\"] = cols\n        res[\"count\"] = len(rows)\n        res[\"rows\"] = rows[:500]\n    except Exception as e:\n        res[\"err\"] = \"%s: %s\" % (type(e).__name__, e)\n    if mode == \"submit\":\n        if res[\"err\"]:\n            res[\"ok\"] = False\n            res[\"msg\"] = \"Your query generated an error. Check the message below the editor and try again.\"\n        else:\n            scols, srows = _q(_fresh_db(seed), sol)\n            ucl = [c.lower() for c in cols]\n            scl = [c.lower() for c in scols]\n            if len(ucl) != len(scl):\n                res[\"ok\"] = False\n                res[\"msg\"] = \"Your query returned %d column(s), but we expected %d: %s.\" % (len(ucl), len(scl), \", \".join(scols))\n            elif ucl != scl:\n                res[\"ok\"] = False\n                res[\"msg\"] = \"Check your column names and their order. We expected: %s.\" % \", \".join(scols)\n            else:\n                u = _norm_rows(rows)\n                s = _norm_rows(srows)\n                if len(u) != len(s):\n                    res[\"ok\"] = False\n                    res[\"msg\"] = \"Your query returned %d row(s), but we expected %d. Check your filtering.\" % (len(u), len(s))\n                elif \"order by\" in sol.lower():\n                    res[\"ok\"] = u == s\n                    if not res[\"ok\"]:\n                        same = sorted(map(repr, u)) == sorted(map(repr, s))\n                        res[\"msg\"] = \"The rows are right, but the order isn't. Check your ORDER BY.\" if same else \"The values in your result don't match what we expected.\"\n                else:\n                    res[\"ok\"] = sorted(map(repr, u)) == sorted(map(repr, s))\n                    if not res[\"ok\"]:\n                        res[\"msg\"] = \"The values in your result don't match what we expected.\"\n    return json.dumps(res, default=str)\n";

      starter:"savings = 100\ngrowth_multiplier = 1.1\ndesc = \"compound interest\"\n\n# Assign product of savings and growth_multiplier to year1\n\n\n# Print the type of year1\n\n\n# Assign sum of desc and desc to doubledesc\n\n\n# Print out doubledesc\n",
      solution:"savings = 100\ngrowth_multiplier = 1.1\ndesc = \"compound interest\"\n\n# Assign product of savings and growth_multiplier to year1\nyear1 = savings * growth_multiplier\n\n# Print the type of year1\nprint(type(year1))\n\n# Assign sum of desc and desc to doubledesc\ndoubledesc = desc + desc\n\n# Print out doubledesc\nprint(doubledesc)\n",
      check:"eq_var('year1')\nprinted(\"<class 'float'>\", 'Print the type of `year1` with `print(type(year1))`.')\neq_var('doubledesc')\nprinted('compound interestcompound interest', 'Print out `doubledesc`.')"},
    {type:"code", title:"Type conversion", xp:100,
      context:"Using the `+` operator to paste together two strings can be very useful in building custom messages. But you can't paste a string and a number together. To fix this, convert the number to a string with `str()`.\n\n`str()`, `int()`, `float()` and `bool()` convert a value into a specific type.",
      instr:["Hit **Run Code** to see the error the current code raises.","Fix the code so that the printout runs without errors. Use `str()` to convert the variables to strings.","Convert the variable `pi_string` to a float and store it as `pi_float`."],
      hint:"Wrap `savings` and `result` in `str()` inside the print call. Use `float(pi_string)`.",
      starter:"# Definition of savings and result\nsavings = 100\nresult = 100 * 1.10 ** 7\n\n# Fix the printout\nprint(\"I started with $\" + savings + \" and now have $\" + result + \". Awesome!\")\n\n# Definition of pi_string\npi_string = \"3.1415926\"\n\n# Convert pi_string into float: pi_float\n",
      solution:"# Definition of savings and result\nsavings = 100\nresult = 100 * 1.10 ** 7\n\n# Fix the printout\nprint(\"I started with $\" + str(savings) + \" and now have $\" + str(result) + \". Awesome!\")\n\n# Definition of pi_string\npi_string = \"3.1415926\"\n\n# Convert pi_string into float: pi_float\npi_float = float(pi_string)\n",
      check:"printed('I started with $100 and now have $194.87', 'Convert `savings` and `result` with `str()` inside the printout.')\neq_var('pi_float', 'Create `pi_float` with `float(pi_string)`.')"}
  ]},
  { title:"Python Lists", desc:"Learn to store, access, and manipulate data in lists: the first step toward efficiently working with huge amounts of data.",
    lessons:[
    {type:"video", title:"Python Lists", slides:[
      {h:"Python data types", b:["float, int, str, bool hold a single value","What if you have many data points?"], code:"height1 = 1.73\nheight2 = 1.68\nheight3 = 1.71\nheight4 = 1.89"},
      {h:"Python list", b:["[a, b, c]","Name a collection of values","Can contain any type, even different types"], code:"fam = [1.73, 1.68, 1.71, 1.89]\nfam", out:"[1.73, 1.68, 1.71, 1.89]"},
      {h:"Mixing types", b:["Store names and heights together"], code:"fam = [\"liz\", 1.73, \"emma\", 1.68, \"mom\", 1.71, \"dad\", 1.89]"},
      {h:"List of lists", b:["Lists can contain other lists"], code:"fam2 = [[\"liz\", 1.73],\n        [\"emma\", 1.68],\n        [\"mom\", 1.71],\n        [\"dad\", 1.89]]\ntype(fam2)", out:"<class 'list'>"}
    ]},
    {type:"code", title:"Create a list", xp:100,
      context:"A list is a compound data type; you can group values together:\n\n`a = \"is\"`\n`b = \"nice\"`\n`my_list = [\"my\", \"list\", a, b]`\n\nAfter measuring the height of your family, you decide to collect information on the house you're living in. The areas of the different parts of your house are stored in separate variables in the script.",
      instr:["Create a list, `areas`, that contains the area of the hallway (`hall`), kitchen (`kit`), living room (`liv`), bedroom (`bed`) and bathroom (`bath`), in this order. Use the predefined variables.","Print `areas` with the `print()` function."],
      hint:"Use square brackets: `areas = [hall, kit, liv, bed, bath]`.",
      starter:"# Area variables (in square meters)\nhall = 11.25\nkit = 18.0\nliv = 20.0\nbed = 10.75\nbath = 9.50\n\n# Create list areas\n\n\n# Print areas\n",
      solution:"# Area variables (in square meters)\nhall = 11.25\nkit = 18.0\nliv = 20.0\nbed = 10.75\nbath = 9.50\n\n# Create list areas\nareas = [hall, kit, liv, bed, bath]\n\n# Print areas\nprint(areas)\n",
      check:"eq_var('areas', 'Make sure `areas` contains `hall`, `kit`, `liv`, `bed` and `bath`, in that order.')\nout_has_sol('Print out `areas`.')"},
    {type:"code", title:"List of lists", xp:100,
      context:"As a data scientist, you'll often be dealing with a lot of data, and it will make sense to group some of this data. Instead of creating a flat list containing strings and floats, representing the names and areas of the rooms in your house, you can create a list of lists.",
      instr:["Finish the list of lists so that it also contains the bedroom and bathroom data. Make sure you enter these in order!","Print out `house`; does this way of structuring your data make more sense?","Print out the type of `house`."],
      hint:"Add `[\"bedroom\", bed]` and `[\"bathroom\", bath]` at the end of `house`.",
      starter:"hall = 11.25\nkit = 18.0\nliv = 20.0\nbed = 10.75\nbath = 9.50\n\n# House information as list of lists\nhouse = [[\"hallway\", hall],\n         [\"kitchen\", kit],\n         [\"living room\", liv]]\n\n# Print out house\n\n\n# Print out the type of house\n",
      solution:"hall = 11.25\nkit = 18.0\nliv = 20.0\nbed = 10.75\nbath = 9.50\n\n# House information as list of lists\nhouse = [[\"hallway\", hall],\n         [\"kitchen\", kit],\n         [\"living room\", liv],\n         [\"bedroom\", bed],\n         [\"bathroom\", bath]]\n\n# Print out house\nprint(house)\n\n# Print out the type of house\nprint(type(house))\n",
      check:"eq_var('house', 'Add the bedroom and the bathroom to `house`, in that order.')\nout_has_sol('Print both `house` and `type(house)`.')"},
    {type:"video", title:"Subsetting Lists", slides:[
      {h:"Zero-based indexing", b:["Each element has an index, starting at 0","Use negative indices to count from the end"], code:"fam = [\"liz\", 1.73, \"emma\", 1.68, \"mom\", 1.71, \"dad\", 1.89]\nfam[3]\nfam[-1]", out:"1.68\n1.89"},
      {h:"List slicing", b:["[start : end]","start is inclusive, end is exclusive"], code:"fam[3:5]", out:"[1.68, 'mom']"},
      {h:"Omitting indices", b:["Leave out start to begin at 0","Leave out end to go to the last element"], code:"fam[:4]\nfam[5:]", out:"['liz', 1.73, 'emma', 1.68]\n[1.71, 'dad', 1.89]"}
    ]},
    {type:"code", title:"Subset and conquer", xp:100,
      context:"Subsetting Python lists is a piece of cake. Take the code sample below, which creates a list `x` and then selects \"b\" from it. Remember that this is the second element, so it has index 1. You can also use negative indexing.\n\n`x = [\"a\", \"b\", \"c\", \"d\"]`\n`x[1]`\n`x[-3] # same result!`",
      instr:["Print out the second element from `areas`, so `11.25`.","Subset and print out the last element of `areas`, being `9.50`. Using a negative index makes sense here!","Select the number representing the area of the living room (`20.0`) and print it out."],
      hint:"Use `areas[1]`, `areas[-1]` and `areas[5]`.",
      starter:"# Create the areas list\nareas = [\"hallway\", 11.25, \"kitchen\", 18.0, \"living room\", 20.0, \"bedroom\", 10.75, \"bathroom\", 9.50]\n\n# Print out second element from areas\n\n\n# Print out last element from areas\n\n\n# Print out the area of the living room\n",
      solution:"# Create the areas list\nareas = [\"hallway\", 11.25, \"kitchen\", 18.0, \"living room\", 20.0, \"bedroom\", 10.75, \"bathroom\", 9.50]\n\n# Print out second element from areas\nprint(areas[1])\n\n# Print out last element from areas\nprint(areas[-1])\n\n# Print out the area of the living room\nprint(areas[5])\n",
      check:"need(out.split() == ['11.25', '9.5', '20.0'], 'Print three values in order: `areas[1]`, `areas[-1]` and `areas[5]`.')"},
    {type:"code", title:"Subset and calculate", xp:100,
      context:"After you've extracted values from a list, you can use them to perform additional calculations.\n\n`x = [\"a\", \"b\", \"c\", \"d\"]`\n`print(x[1] + x[3])`",
      instr:["Using a combination of list subsetting and variable assignment, create a new variable, `eat_sleep_area`, that contains the sum of the area of the kitchen and the area of the bedroom.","Print the new variable `eat_sleep_area`."],
      hint:"The kitchen area is at index 3 and the bedroom area at index -3.",
      starter:"areas = [\"hallway\", 11.25, \"kitchen\", 18.0, \"living room\", 20.0, \"bedroom\", 10.75, \"bathroom\", 9.50]\n\n# Sum of kitchen and bedroom area: eat_sleep_area\n\n\n# Print the variable eat_sleep_area\n",
      solution:"areas = [\"hallway\", 11.25, \"kitchen\", 18.0, \"living room\", 20.0, \"bedroom\", 10.75, \"bathroom\", 9.50]\n\n# Sum of kitchen and bedroom area: eat_sleep_area\neat_sleep_area = areas[3] + areas[-3]\n\n# Print the variable eat_sleep_area\nprint(eat_sleep_area)\n",
      check:"eq_var('eat_sleep_area', '`eat_sleep_area` should be the kitchen area plus the bedroom area.')\nprinted('28.75', 'Print out `eat_sleep_area`.')"},
    {type:"code", title:"Slicing and dicing", xp:100,
      context:"Selecting single values from a list is just one part of the story. It's also possible to slice your list, which means selecting multiple elements from your list. Use the syntax `my_list[start:end]`. The `start` index will be included, while the `end` index is not.",
      instr:["Use slicing to create a list, `downstairs`, that contains the first 6 elements of `areas`.","Do a similar thing to create a new variable, `upstairs`, that contains the last 4 elements of `areas`.","Print both `downstairs` and `upstairs` using `print()`."],
      hint:"`areas[:6]` gives the first six elements and `areas[6:]` the rest.",
      starter:"areas = [\"hallway\", 11.25, \"kitchen\", 18.0, \"living room\", 20.0, \"bedroom\", 10.75, \"bathroom\", 9.50]\n\n# Use slicing to create downstairs\n\n\n# Use slicing to create upstairs\n\n\n# Print out downstairs and upstairs\n",
      solution:"areas = [\"hallway\", 11.25, \"kitchen\", 18.0, \"living room\", 20.0, \"bedroom\", 10.75, \"bathroom\", 9.50]\n\n# Use slicing to create downstairs\ndownstairs = areas[:6]\n\n# Use slicing to create upstairs\nupstairs = areas[6:]\n\n# Print out downstairs and upstairs\nprint(downstairs)\nprint(upstairs)\n",
      check:"eq_var('downstairs')\neq_var('upstairs')\nout_has_sol('Print both `downstairs` and `upstairs`.')"},
    {type:"video", title:"Manipulating Lists", slides:[
      {h:"Change list elements", b:["Assign to an index or a slice"], code:"fam[7] = 1.86\nfam[0:2] = [\"lisa\", 1.74]"},
      {h:"Add and remove elements", b:["Use + to add elements","Use del to remove them"], code:"fam_ext = fam + [\"me\", 1.79]\ndel fam[2]"},
      {h:"Behind the scenes", b:["A list variable stores a reference to the list","y = x copies the reference, not the list","Use list(x) or x[:] to make a real copy"], code:"x = [\"a\", \"b\", \"c\"]\ny = list(x)\ny[1] = \"z\"\nx", out:"['a', 'b', 'c']"}
    ]},
    {type:"code", title:"Replace list elements", xp:100,
      context:"Replacing list elements is pretty easy. Simply subset the list and assign new values to the subset. You can select single elements or you can change entire list slices at once.",
      instr:["You did a miscalculation when determining the area of the bathroom; it's 10.50 square meters instead of 9.50. Can you make the changes?","Make the `areas` list more trendy! Change `\"living room\"` to `\"chill zone\"`."],
      hint:"Use `areas[-1] = 10.50` and `areas[4] = \"chill zone\"`.",
      starter:"areas = [\"hallway\", 11.25, \"kitchen\", 18.0, \"living room\", 20.0, \"bedroom\", 10.75, \"bathroom\", 9.50]\n\n# Correct the bathroom area\n\n\n# Change \"living room\" to \"chill zone\"\n",
      solution:"areas = [\"hallway\", 11.25, \"kitchen\", 18.0, \"living room\", 20.0, \"bedroom\", 10.75, \"bathroom\", 9.50]\n\n# Correct the bathroom area\nareas[-1] = 10.50\n\n# Change \"living room\" to \"chill zone\"\nareas[4] = \"chill zone\"\n",
      check:"need(U.get('areas', [None])[-1] == 10.5, 'Update the last element of `areas` to `10.50`.')\neq_var('areas', 'Change `\"living room\"` (index 4) to `\"chill zone\"`.')"},
    {type:"code", title:"Extend a list", xp:100,
      context:"If you can change elements in a list, you sure want to be able to add elements to it, right? You can use the `+` operator:\n\n`x = [\"a\", \"b\", \"c\", \"d\"]`\n`y = x + [\"e\", \"f\"]`\n\nYou just won the lottery, awesome! You decide to build a poolhouse and a garage.",
      instr:["Use the `+` operator to paste the list `[\"poolhouse\", 24.5]` to the end of the `areas` list. Store the resulting list as `areas_1`.","Further extend `areas_1` by adding data on your garage. Add the string `\"garage\"` and float `15.45`. Name the resulting list `areas_2`."],
      hint:"`areas_1 = areas + [\"poolhouse\", 24.5]`.",
      starter:"areas = [\"hallway\", 11.25, \"kitchen\", 18.0, \"chill zone\", 20.0, \"bedroom\", 10.75, \"bathroom\", 10.50]\n\n# Add poolhouse data to areas, new list is areas_1\n\n\n# Add garage data to areas_1, new list is areas_2\n",
      solution:"areas = [\"hallway\", 11.25, \"kitchen\", 18.0, \"chill zone\", 20.0, \"bedroom\", 10.75, \"bathroom\", 10.50]\n\n# Add poolhouse data to areas, new list is areas_1\nareas_1 = areas + [\"poolhouse\", 24.5]\n\n# Add garage data to areas_1, new list is areas_2\nareas_2 = areas_1 + [\"garage\", 15.45]\n",
      check:"eq_var('areas_1')\neq_var('areas_2')"},
    {type:"mcq", title:"Inner workings of lists",
      context:"Python lists store references to their data, not the values themselves.",
      q:"What does `x` contain after running the code below?", code:"x = [\"a\", \"b\", \"c\"]\ny = x\ny[1] = \"z\"",
      options:["['a', 'b', 'c']","['a', 'z', 'c']","['z', 'b', 'c']","An error is raised"], answer:1,
      fb:["Remember: `y = x` doesn't copy the list. Both names point to the same list.","Correct! `x` and `y` refer to the same list, so changing `y` changes `x` too.","Index 1 is the second element.","Assigning to a list element is perfectly valid."]}
  ]},
  { title:"Functions and Packages", desc:"Learn how to use functions, methods, and packages to efficiently leverage the code that brilliant Python developers have written.",
    lessons:[
    {type:"video", title:"Functions", slides:[
      {h:"Functions", b:["A piece of reusable code","Solves a particular task","Call the function instead of writing the code yourself"], code:"fam = [1.73, 1.68, 1.71, 1.89]\nmax(fam)", out:"1.89"},
      {h:"Arguments", b:["Pass inputs between the parentheses","Some arguments are optional"], code:"round(1.68, 1)\nround(1.68)", out:"1.7\n2"},
      {h:"Getting help", b:["Use help() to see a function's documentation","round(number, ndigits=None)"], code:"help(round)"}
    ]},
    {type:"code", title:"Familiar functions", xp:100,
      context:"Out of the box, Python offers a bunch of built-in functions to make your life as a data scientist easier. You already know two such functions: `print()` and `type()`. There are also functions like `str()`, `int()`, `bool()` and `float()` to switch between data types.",
      instr:["Use `print()` in combination with `type()` to print out the type of `var1`.","Use `len()` to get the length of the list `var1`. Wrap it in a `print()` call to directly print it out.","Use `int()` to convert `var2` to an integer. Store the output as `out2`."],
      hint:"`print(len(var1))` prints the length. `int(True)` is `1`.",
      starter:"# Create variables var1 and var2\nvar1 = [1, 2, 3, 4]\nvar2 = True\n\n# Print out type of var1\n\n\n# Print out length of var1\n\n\n# Convert var2 to an integer: out2\n",
      solution:"# Create variables var1 and var2\nvar1 = [1, 2, 3, 4]\nvar2 = True\n\n# Print out type of var1\nprint(type(var1))\n\n# Print out length of var1\nprint(len(var1))\n\n# Convert var2 to an integer: out2\nout2 = int(var2)\n",
      check:"printed(\"<class 'list'>\", 'Print the type of `var1`.')\nprinted('4', 'Print the length of `var1`.')\neq_var('out2', 'Convert `var2` with `int()` and store it as `out2`.')"},
    {type:"code", title:"Multiple arguments", xp:100,
      context:"Have a look at the documentation of `sorted()`:\n\n`sorted(iterable, /, *, key=None, reverse=False)`\n\n`iterable` is any collection of objects. `reverse` sorts in descending order when set to `True`.",
      instr:["Use `+` to merge the contents of `first` and `second` into a new list: `full`.","Call `sorted()` on `full` and specify the `reverse` argument to be `True`. Save the sorted list as `full_sorted`.","Finish off by printing out `full_sorted`."],
      hint:"`sorted(full, reverse=True)`.",
      starter:"# Create lists first and second\nfirst = [11.25, 18.0, 20.0]\nsecond = [10.75, 9.50]\n\n# Paste together first and second: full\n\n\n# Sort full in descending order: full_sorted\n\n\n# Print out full_sorted\n",
      solution:"# Create lists first and second\nfirst = [11.25, 18.0, 20.0]\nsecond = [10.75, 9.50]\n\n# Paste together first and second: full\nfull = first + second\n\n# Sort full in descending order: full_sorted\nfull_sorted = sorted(full, reverse=True)\n\n# Print out full_sorted\nprint(full_sorted)\n",
      check:"eq_var('full')\neq_var('full_sorted', 'Use `sorted()` with `reverse=True`.')\nout_has_sol('Print out `full_sorted`.')"},
    {type:"video", title:"Methods", slides:[
      {h:"Built-in functions", b:["max(), len(), round() and friends","Not everything you need is a built-in function"]},
      {h:"Methods", b:["Everything in Python is an object","Each object has methods, depending on its type","Methods are functions that belong to objects"], code:"fam = [\"liz\", 1.73, \"emma\", 1.68, \"mom\", 1.71, \"dad\", 1.89]\nfam.index(\"mom\")\nfam.count(1.73)", out:"4\n1"},
      {h:"String methods", b:["Same idea, different object type"], code:"sister = \"liz\"\nsister.capitalize()\nsister.replace(\"z\", \"sa\")", out:"'Liz'\n'lisa'"},
      {h:"Methods can change objects", b:["Some methods modify the object they're called on"], code:"fam.append(\"me\")\nfam.append(1.79)\nlen(fam)", out:"10"}
    ]},
    {type:"code", title:"String Methods", xp:100,
      context:"Strings come with a bunch of methods. Follow the instructions closely to discover some of them. If you want to discover them in more detail, you can always type `help(str)` in the IPython Shell.",
      instr:["Use the `upper()` method on `place` and store the result in `place_up`. Use the syntax for calling methods that you learned in the previous video.","Print out `place` and `place_up`. Did both change?","Print out the number of o's on the variable `place` by calling `count()` on `place` and passing the letter `'o'` as an input to the method."],
      hint:"`place.upper()` and `place.count('o')`.",
      starter:"# string to experiment with: place\nplace = \"poolhouse\"\n\n# Use upper() on place: place_up\n\n\n# Print out place and place_up\n\n\n# Print out the number of o's in place\n",
      solution:"# string to experiment with: place\nplace = \"poolhouse\"\n\n# Use upper() on place: place_up\nplace_up = place.upper()\n\n# Print out place and place_up\nprint(place)\nprint(place_up)\n\n# Print out the number of o's in place\nprint(place.count('o'))\n",
      check:"eq_var('place_up')\nneed(out.split() == ['poolhouse', 'POOLHOUSE', '3'], 'Print `place`, then `place_up`, then the number of o\\'s in `place`.')"},
    {type:"code", title:"List Methods", xp:100,
      context:"Strings are not the only Python types that have methods associated with them. Lists, floats, integers and booleans are also types that come packaged with a bunch of useful methods.\n\n- `index()`, to get the index of the first element of a list that matches its input\n- `count()`, to get the number of times an element appears in a list",
      instr:["Use the `index()` method to get the index of the element in `areas` that is equal to `20.0`. Print out this index.","Call `count()` on `areas` to find out how many times `9.50` appears in the list. Again, simply print out this number."],
      hint:"`print(areas.index(20.0))`.",
      starter:"# Create list areas\nareas = [11.25, 18.0, 20.0, 10.75, 9.50]\n\n# Print out the index of the element 20.0\n\n\n# Print out how often 9.50 appears in areas\n",
      solution:"# Create list areas\nareas = [11.25, 18.0, 20.0, 10.75, 9.50]\n\n# Print out the index of the element 20.0\nprint(areas.index(20.0))\n\n# Print out how often 9.50 appears in areas\nprint(areas.count(9.50))\n",
      check:"need(out.split() == ['2', '1'], 'Print the index of `20.0`, then the count of `9.50`.')"},
    {type:"code", title:"List Methods (2)", xp:100,
      context:"Most list methods will change the list they're called on. Examples are:\n\n- `append()`, that adds an element to the list it is called on\n- `remove()`, that removes the first element of a list that matches the input\n- `reverse()`, that reverses the order of the elements in the list it is called on",
      instr:["Use `append()` twice to add the size of the poolhouse (`24.5`) and the garage (`15.45`) to `areas`, in that order.","Print out `areas`.","Use the `reverse()` method to reverse the order of the elements in `areas`.","Print out `areas` once more."],
      hint:"`areas.append(24.5)` changes `areas` in place, so you don't need to reassign.",
      starter:"# Create list areas\nareas = [11.25, 18.0, 20.0, 10.75, 9.50]\n\n# Use append twice to add poolhouse and garage size\n\n\n# Print out areas\n\n\n# Reverse the orders of the elements in areas\n\n\n# Print out areas\n",
      solution:"# Create list areas\nareas = [11.25, 18.0, 20.0, 10.75, 9.50]\n\n# Use append twice to add poolhouse and garage size\nareas.append(24.5)\nareas.append(15.45)\n\n# Print out areas\nprint(areas)\n\n# Reverse the orders of the elements in areas\nareas.reverse()\n\n# Print out areas\nprint(areas)\n",
      check:"eq_var('areas', 'Append `24.5` and `15.45`, then call `areas.reverse()`.')\nout_has_sol('Print out `areas` before and after reversing it.')"},
    {type:"video", title:"Packages", slides:[
      {h:"Packages", b:["A directory of Python scripts","Each script is a module","Specify functions, methods and types","Thousands of packages available: NumPy, Matplotlib, scikit-learn"]},
      {h:"Install a package", b:["Use pip, the package manager, from your terminal"], code:"pip install numpy"},
      {h:"Import a package", b:["import the whole package, optionally with an alias","Or import only what you need"], code:"import numpy as np\nnp.array([1, 2, 3])\n\nfrom numpy import array\narray([1, 2, 3])", out:"array([1, 2, 3])\narray([1, 2, 3])"}
    ]},
    {type:"code", title:"Import package", xp:100,
      context:"As a data scientist, some notions of geometry never hurt. Let's refresh some of the basics.\n\nFor a fancy clustering algorithm, you want to find the circumference, `C`, and area, `A`, of a circle. When the radius of the circle is `r`, you can calculate `C` and `A` as:\n\nC = 2πr and A = πr²\n\nTo use the constant `pi`, you'll need the `math` package.",
      instr:["Import the `math` package. Now you can access the constant `pi` with `math.pi`.","Calculate the circumference of the circle and store it in `C`.","Calculate the area of the circle and store it in `A`."],
      hint:"`C = 2 * math.pi * r` and `A = math.pi * r ** 2`.",
      starter:"# Definition of radius\nr = 0.43\n\n# Import the math package\n\n\n# Calculate C\nC = 0\n\n# Calculate A\nA = 0\n\n# Build printout\nprint(\"Circumference: \" + str(C))\nprint(\"Area: \" + str(A))\n",

    {type:"code", title:"Selective import", xp:100,
      context:"General imports, like `import math`, make all functionality from the `math` package available to you. However, if you decide to only use a specific part of a package, you can always make your import more selective:\n\n`from math import pi`\n\nLet's say the Moon's orbit around planet Earth is a perfect circle, with a radius `r` (in km) that is defined in the script.",
      instr:["Perform a selective import from the `math` package where you only import the `radians` function.","Calculate the distance travelled by the Moon over 12 degrees of its orbit. Assign the result to `dist`. You can calculate this as `r * phi`, where `r` is the radius and `phi` is the angle in radians.","Print out `dist`."],
      hint:"`from math import radians`, then `dist = r * radians(12)`.",
      starter:"# Definition of radius\nr = 192500\n\n# Import radians function of math package\n\n\n# Travel distance of Moon over 12 degrees. Store in dist.\n\n\n# Print out dist\n",
      solution:"# Definition of radius\nr = 192500\n\n# Import radians function of math package\nfrom math import radians\n\n# Travel distance of Moon over 12 degrees. Store in dist.\ndist = r * radians(12)\n\n# Print out dist\nprint(dist)\n",
      check:"need('radians' in U, 'Import the `radians` function with `from math import radians`.')\neq_var('dist', 'Calculate `dist` as `r * radians(12)`.')\nout_has_sol('Print out `dist`.')"}

  { title:"NumPy", desc:"NumPy is a fundamental Python package to efficiently practice data science. Learn to work with powerful tools in the NumPy array, and get started with data exploration.",
    lessons:[
    {type:"video", title:"NumPy", slides:[
      {h:"Lists recap", b:["Powerful: collection of values, can hold different types, easy to change","Missing: mathematical operations over collections"], code:"height = [1.73, 1.68, 1.71, 1.89, 1.79]\nweight = [65.4, 59.2, 63.6, 88.4, 68.7]\nweight / height ** 2", out:"TypeError: unsupported operand type(s) for ** or pow(): 'list' and 'int'"},
      {h:"Solution: NumPy", b:["Numeric Python","Alternative to Python lists: the NumPy array","Calculations over entire arrays, easy and fast"], code:"import numpy as np\nnp_height = np.array(height)\nnp_weight = np.array(weight)\nbmi = np_weight / np_height ** 2\nbmi", out:"array([21.852, 20.975, 21.75 , 24.747, 21.441])"},
      {h:"NumPy arrays contain one type", b:["Different types are coerced to a single type"], code:"np.array([1.0, \"is\", True])", out:"array(['1.0', 'is', 'True'], dtype='<U32')"},
      {h:"Different types, different behavior", b:["+ concatenates lists but adds arrays element-wise"], code:"[1, 2, 3] + [1, 2, 3]\nnp.array([1, 2, 3]) + np.array([1, 2, 3])", out:"[1, 2, 3, 1, 2, 3]\narray([2, 4, 6])"},
      {h:"NumPy subsetting", b:["Index like a list","Or use an array of booleans"], code:"bmi[1]\nbmi > 23\nbmi[bmi > 23]", out:"20.975\narray([False, False, False,  True, False])\narray([24.747])"}
    ]},
    {type:"code", title:"Your First NumPy Array", xp:100,
      context:"In this chapter, we're going to dive into the world of baseball. Along the way, you'll get comfortable with the basics of NumPy, a powerful package to do data science.\n\nA list `baseball` has already been defined in the script, representing the height of some baseball players in centimeters.",
      instr:["Import the `numpy` package as `np`, so that you can refer to `numpy` with `np`.","Use `np.array()` to create a NumPy array from `baseball`. Name this array `np_baseball`.","Print out the type of `np_baseball` to check that you got it right."],
      hint:"`import numpy as np`, then `np_baseball = np.array(baseball)`.",
      starter:"# Create list baseball\nbaseball = [180, 215, 210, 210, 188, 176, 209, 200]\n\n# Import the numpy package as np\n\n\n# Create a NumPy array from baseball: np_baseball\n\n\n# Print out type of np_baseball\n",
      solution:"# Create list baseball\nbaseball = [180, 215, 210, 210, 188, 176, 209, 200]\n\n# Import the numpy package as np\nimport numpy as np\n\n# Create a NumPy array from baseball: np_baseball\nnp_baseball = np.array(baseball)\n\n# Print out type of np_baseball\nprint(type(np_baseball))\n",
      check:"need('np' in U, 'Import numpy with `import numpy as np`.')\neq_var('np_baseball', 'Create `np_baseball` with `np.array(baseball)`.')\nprinted(\"<class 'numpy.ndarray'>\", 'Print out the type of `np_baseball`.')"},
    {type:"code", title:"Baseball players' height", xp:100,
      context:"You are a huge baseball fan. You decide to call the MLB (Major League Baseball) and ask around for some more statistics on the height of the main players. They pass along data on more than a thousand players; here you'll work with a sample of 20 of them.\n\nThe heights are stored in a regular Python list: `height_in`. The height is expressed in inches.",
      instr:["Create a NumPy array from `height_in`. Name this new array `np_height_in`.","Print `np_height_in`.","Multiply `np_height_in` with `0.0254` to convert all height measurements from inches to meters. Store the new values in a new array, `np_height_m`.","Print out `np_height_m` and check if the output makes sense."],
      hint:"`np_height_m = np_height_in * 0.0254`.",
      starter:PY_BASEBALL+"\n\n# Import numpy\nimport numpy as np\n\n# Create a numpy array from height_in: np_height_in\n\n\n# Print out np_height_in\n\n\n# Convert np_height_in to m: np_height_m\n\n\n# Print np_height_m\n",
      solution:PY_BASEBALL+"\n\n# Import numpy\nimport numpy as np\n\n# Create a numpy array from height_in: np_height_in\nnp_height_in = np.array(height_in)\n\n# Print out np_height_in\nprint(np_height_in)\n\n# Convert np_height_in to m: np_height_m\nnp_height_m = np_height_in * 0.0254\n\n# Print np_height_m\nprint(np_height_m)\n",
      check:"eq_var('np_height_in')\neq_var('np_height_m', 'Multiply `np_height_in` by `0.0254`.')\nout_has_sol('Print both `np_height_in` and `np_height_m`.')"},
    {type:"code", title:"Baseball player's BMI", xp:100,
      context:"The MLB also offers to let you analyze their weight data. Again, both are available as regular Python lists: `height_in` and `weight_lb`. `height_in` is in inches and `weight_lb` is in pounds.\n\nIt's now possible to calculate the BMI of each baseball player, and to find the lighter ones with boolean subsetting.",
      instr:["Create a NumPy array from `weight_lb` and multiply it by `0.453592` to go from pounds to kilograms. Store the result as `np_weight_kg`.","Use `np_height_m` and `np_weight_kg` to calculate the BMI of each player: `bmi = weight / height ** 2`. Save the result as `bmi`.","Create a boolean array, `light`, that is `True` where `bmi` is below 21.","Print out `bmi[light]`: the BMIs of all players with a BMI below 21."],
      hint:"`light = bmi < 21`, then `print(bmi[light])`.",
      starter:PY_BASEBALL+"\n\nimport numpy as np\nnp_height_m = np.array(height_in) * 0.0254\n\n# Create array from weight_lb with metric units: np_weight_kg\n\n\n# Calculate the BMI: bmi\n\n\n# Create the light array\n\n\n# Print out BMIs of all baseball players whose BMI is below 21\n",
      solution:PY_BASEBALL+"\n\nimport numpy as np\nnp_height_m = np.array(height_in) * 0.0254\n\n# Create array from weight_lb with metric units: np_weight_kg\nnp_weight_kg = np.array(weight_lb) * 0.453592\n\n# Calculate the BMI: bmi\nbmi = np_weight_kg / np_height_m ** 2\n\n# Create the light array\nlight = bmi < 21\n\n# Print out BMIs of all baseball players whose BMI is below 21\nprint(bmi[light])\n",
      check:"eq_var('np_weight_kg', 'Multiply `np.array(weight_lb)` by `0.453592`.')\neq_var('bmi', 'Calculate `bmi` as `np_weight_kg / np_height_m ** 2`.')\neq_var('light', '`light` should be `bmi < 21`.')\nout_has_sol('Print out `bmi[light]`.')"},
    {type:"mcq", title:"NumPy Side Effects",
      context:"NumPy arrays can only contain one type. When you combine booleans and numbers, booleans are converted: `True` becomes `1` and `False` becomes `0`.",
      q:"What is the result of this code?", code:"np.array([True, 1, 2]) + np.array([3, 4, False])",
      options:["array([True, 1, 2, 3, 4, False])","array([4, 3, 0]) + array([0, 2, 2])","array([4, 5, 2])","array([3, 5, 3])"], answer:2,
      fb:["`+` on NumPy arrays adds element-wise, it doesn't concatenate.","Not quite. Compute each position: 1+3, 1+4, 2+0.","Correct! True becomes 1 and False becomes 0, then the arrays are added element-wise.","Close, but check the conversion of True and False."]},
    {type:"video", title:"2D NumPy Arrays", slides:[

      {h:"2D NumPy arrays", b:["Create from a list of lists","shape gives (rows, columns)"], code:"np_2d = np.array([[1.73, 1.68, 1.71, 1.89, 1.79],\n                  [65.4, 59.2, 63.6, 88.4, 68.7]])\nnp_2d.shape", out:"(2, 5)"},

    ]},
    {type:"code", title:"Subsetting 2D NumPy Arrays", xp:100,
      context:"If your 2D NumPy array has a regular structure, i.e. each row and column has a fixed number of values, complicated ways of subsetting become very easy.\n\n`np_x[:, 0]` selects the first column, and `np_x[1, :]` selects the second row.\n\nThe list of lists `baseball` contains, for each player, `[height, weight]`.",
      instr:["Create `np_baseball`, a 2D NumPy array from `baseball`.","Print out the 5th row of `np_baseball`.","Make a new variable, `np_weight_lb`, containing the entire second column of `np_baseball`.","Select the height (first column) of the 9th baseball player in `np_baseball` and print it out."],
      hint:"The 5th row is `np_baseball[4, :]`. The 9th player's height is `np_baseball[8, 0]`.",
      starter:PY_BASEBALL+"\n\nimport numpy as np\n\n# Create np_baseball (2 cols)\n\n\n# Print out the 5th row of np_baseball\n\n\n# Select the entire second column of np_baseball: np_weight_lb\n\n\n# Print out height of 9th player\n",
      solution:PY_BASEBALL+"\n\nimport numpy as np\n\n# Create np_baseball (2 cols)\nnp_baseball = np.array(baseball)\n\n# Print out the 5th row of np_baseball\nprint(np_baseball[4, :])\n\n# Select the entire second column of np_baseball: np_weight_lb\nnp_weight_lb = np_baseball[:, 1]\n\n# Print out height of 9th player\nprint(np_baseball[8, 0])\n",
      check:"eq_var('np_baseball')\neq_var('np_weight_lb', 'Select the second column with `np_baseball[:, 1]`.')\nout_has_sol('Print the 5th row and the height of the 9th player.')"},
    {type:"video", title:"NumPy: Basic Statistics", slides:[
      {h:"Data analysis", b:["Get to know your data","Little data: simply look at it","Big data: summarizing statistics"]},
      {h:"Summarizing statistics", b:["np.mean(), np.median()","np.std() for the standard deviation","np.corrcoef() for correlation"], code:"np.mean(np_height)\nnp.median(np_height)\nnp.corrcoef(np_height, np_weight)"},
      {h:"Generate data", b:["Simulate data with np.random"], code:"height = np.round(np.random.normal(1.75, 0.20, 5000), 2)\nweight = np.round(np.random.normal(60.32, 15, 5000), 2)\nnp_city = np.column_stack((height, weight))"}
    ]},
    {type:"code", title:"Average versus median", xp:100,
      context:"You now know how to use NumPy functions to get a better feeling for your data.\n\nThe baseball data is available as a 2D NumPy array, `np_baseball`, with the height in inches in the first column and the weight in pounds in the second.",
      instr:["Create a NumPy array `np_height_in` that is equal to the first column of `np_baseball`.","Print out the mean of `np_height_in`.","Print out the median of `np_height_in`.","Use `np.corrcoef()` to store the correlation between the first and second column of `np_baseball` in `corr`."],

      starter:PY_BASEBALL+"\n\nimport numpy as np\nnp_baseball = np.array(baseball)\n\n# Create np_height_in from np_baseball\n\n\n# Print out the mean of np_height_in\n\n\n# Print out the median of np_height_in\n\n\n# Correlation between height and weight: corr\n",
      solution:PY_BASEBALL+"\n\nimport numpy as np\nnp_baseball = np.array(baseball)\n\n# Create np_height_in from np_baseball\nnp_height_in = np_baseball[:, 0]\n\n# Print out the mean of np_height_in\nprint(np.mean(np_height_in))\n\n# Print out the median of np_height_in\nprint(np.median(np_height_in))\n\n# Correlation between height and weight: corr\ncorr = np.corrcoef(np_baseball[:, 0], np_baseball[:, 1])\n",

/* ================= INTRO TO SQL ================= */
{
  id:"intro-sql", title:"Introduction to SQL", tech:"SQL", level:"Beginner", hours:2,
  desc:"Learn how to write SQL queries to select, filter, summarize and sort data in a relational database.",
  long:"SQL is the most widely used language for working with data stored in relational databases. In this course you'll query a database of well-known films. You'll select columns, remove duplicates, count records, filter with WHERE, LIKE and IN, handle missing values, and summarize data with aggregate functions, GROUP BY and HAVING. Queries run on a real SQLite engine in your browser.",
  pkgs:["sqlite3"], lang:"sql",
  datasets:["films: 31 well-known films (gross and budget are approximate US figures)"],
  chapters:[
  { title:"Selecting Data", desc:"Learn your first SQL keywords for selecting and counting data from a relational database.",
    lessons:[
    {type:"video", title:"Introducing Queries", slides:[
      {h:"Relational databases", b:["Data is organized in tables","Rows are records, columns are fields","Tables can relate to each other through keys"]},
      {h:"SQL", b:["Structured Query Language","Keywords like SELECT and FROM tell the database what to do","Keywords are written in capitals by convention"]},
      {h:"Your first query", b:["SELECT names the fields you want","FROM names the table they come from","End the query with a semicolon"], code:"SELECT title\nFROM films;"},
      {h:"Selecting multiple fields", b:["Separate field names with commas","Use * to select every field"], code:"SELECT title, release_year\nFROM films;\n\nSELECT *\nFROM films;"}
    ]},
    {type:"code", title:"SELECTing single columns", xp:100,
      context:"While SQL can be used to create and modify data, the focus of this course will be **querying** data. A query is a request for data from a database table.\n\nThe `films` table is shown in the **Tables** tab below the editor. Type your query in the editor and hit **Run Code** to see the result, or **Submit Answer** to get feedback.",
      instr:["Select the `title` column from the `films` table."],
      hint:"`SELECT title FROM films;`",
      starter:"-- Select the title column from films\n",
      solution:"-- Select the title column from films\nSELECT title\nFROM films;\n"},
    {type:"code", title:"SELECTing multiple columns", xp:100,
      context:"To select multiple columns from a table, separate the column names with commas. For example, this query selects two columns, `name` and `birthdate`, from the `people` table:\n\n`SELECT name, birthdate FROM people;`",
      instr:["Select the `title`, `release_year` and `country` for every film, in that order."],
      hint:"List the columns after SELECT, separated by commas.",
      starter:"-- Select title, release_year and country\n",
      solution:"-- Select title, release_year and country\nSELECT title, release_year, country\nFROM films;\n"},
    {type:"code", title:"SELECT DISTINCT", xp:100,
      context:"Often your results will include many duplicate values. If you want to select all the unique values from a column, use the `DISTINCT` keyword.\n\n`SELECT DISTINCT language FROM films;`",
      instr:["Get the unique countries represented in the `films` table."],
      hint:"Put `DISTINCT` right after `SELECT`.",
      starter:"-- Select the unique countries\n",
      solution:"-- Select the unique countries\nSELECT DISTINCT country\nFROM films;\n"},
    {type:"code", title:"Aliasing", xp:100,
      context:"Sometimes a column name isn't clear, or you want to rename it in the result. Use `AS` to give it an alias. The alias only exists in the result; the underlying table doesn't change.\n\n`SELECT name AS first_name FROM people;`",
      instr:["Select `title` aliased as `film_title` and `duration` aliased as `minutes` from the `films` table."],
      hint:"`SELECT title AS film_title, duration AS minutes`",
      starter:"-- Alias title and duration\n",
      solution:"-- Alias title and duration\nSELECT title AS film_title, duration AS minutes\nFROM films;\n"},
    {type:"video", title:"COUNT()", slides:[
      {h:"COUNT()", b:["Counts the number of records with a value in a field","Use an alias for clarity"], code:"SELECT COUNT(gross) AS count_gross\nFROM films;"},
      {h:"COUNT(*)", b:["COUNT(*) counts all records in a table, including NULLs","COUNT(field) ignores NULL values"], code:"SELECT COUNT(*) AS total_records\nFROM films;"},
      {h:"COUNT with DISTINCT", b:["Combine COUNT and DISTINCT to count unique values"], code:"SELECT COUNT(DISTINCT language) AS count_languages\nFROM films;"}
    ]},
    {type:"code", title:"Practice with COUNT()", xp:100,
      context:"`COUNT()` counts the number of non-missing values in a field. One film in the table has no recorded `gross`, so counting `gross` gives a different number than counting every row.",
      instr:["Count the number of non-missing values in the `gross` column. Alias the result as `count_gross`."],
      hint:"`SELECT COUNT(gross) AS count_gross FROM films;`",
      starter:"-- Count the gross values\n",
      solution:"-- Count the gross values\nSELECT COUNT(gross) AS count_gross\nFROM films;\n"},
    {type:"code", title:"COUNT() and DISTINCT", xp:100,
      context:"Combining `COUNT()` with `DISTINCT` is common practice to count the number of unique values in a field.",
      instr:["Count the number of distinct countries in the `films` table. Alias the result as `count_distinct_countries`."],
      hint:"`COUNT(DISTINCT country)`",
      starter:"-- Count the distinct countries\n",
      solution:"-- Count the distinct countries\nSELECT COUNT(DISTINCT country) AS count_distinct_countries\nFROM films;\n"},
    {type:"mcq", title:"Order of execution",
      context:"SQL isn't processed in the order it's written. Knowing the processing order helps you debug queries.",
      q:"In the query below, which clause does the database process first?", code:"SELECT title\nFROM films\nLIMIT 3;",
      options:["SELECT","FROM","LIMIT","They're processed at the same time"], answer:1,
      fb:["SELECT is processed after the table is identified.","Correct! The database first needs to know which table to use, then picks fields, then limits the results.","LIMIT is processed last.","Clauses are processed in a fixed order."]}
  ]},
  { title:"Filtering Records", desc:"Learn about how you can filter numerical and textual data with SQL. Filtering is an important use for this language.",
    lessons:[
    {type:"video", title:"Filtering numbers", slides:[
      {h:"WHERE", b:["Filters records that meet a condition","Comes after FROM"], code:"SELECT title\nFROM films\nWHERE release_year > 2000;"},
      {h:"Comparison operators", b:["> greater than, < less than","= equal to, <> not equal to","<= and >= for inclusive comparisons"], code:"SELECT title\nFROM films\nWHERE duration <= 120;"},
      {h:"Filtering strings", b:["Wrap text values in single quotes"], code:"SELECT title\nFROM films\nWHERE country = 'Japan';"}
    ]},
    {type:"code", title:"Using WHERE with numbers", xp:100,
      context:"Filtering with `WHERE` allows you to analyze your data better. Use comparison operators to compare numeric values.",
      instr:["Select the `title` and `release_year` of all films released after 2000."],
      hint:"Use `WHERE release_year > 2000`.",
      starter:"-- Films released after 2000\n",
      solution:"-- Films released after 2000\nSELECT title, release_year\nFROM films\nWHERE release_year > 2000;\n"},
    {type:"code", title:"Using WHERE with text", xp:100,
      context:"`WHERE` can also filter string values. Remember that strings are wrapped in single quotes.",
      instr:["Select the `title` and `country` of all films from Japan."],
      hint:"`WHERE country = 'Japan'`",
      starter:"-- Films from Japan\n",
      solution:"-- Films from Japan\nSELECT title, country\nFROM films\nWHERE country = 'Japan';\n"},
    {type:"video", title:"Multiple criteria", slides:[
      {h:"OR", b:["At least one condition must be true"], code:"SELECT title\nFROM films\nWHERE release_year = 1994\n   OR release_year = 2000;"},
      {h:"AND", b:["Every condition must be true"], code:"SELECT title\nFROM films\nWHERE release_year > 1994\n  AND release_year < 2000;"},
      {h:"BETWEEN", b:["Shorthand for a range","BETWEEN is inclusive: both ends are included"], code:"SELECT title\nFROM films\nWHERE release_year BETWEEN 1994 AND 2000;"}
    ]},
    {type:"code", title:"Using AND", xp:100,
      context:"You can combine `BETWEEN` and `AND` with other conditions to build precise filters.",
      instr:["Select the `title` and `release_year` of all R-rated films released in the 1990s (from 1990 to 1999)."],
      hint:"`WHERE release_year BETWEEN 1990 AND 1999 AND certification = 'R'`",
      starter:"-- R-rated films from the 1990s\n",
      solution:"-- R-rated films from the 1990s\nSELECT title, release_year\nFROM films\nWHERE release_year BETWEEN 1990 AND 1999\n  AND certification = 'R';\n"},
    {type:"code", title:"Using OR", xp:100,
      context:"Use `OR` when you want records that match at least one of several conditions.",
      instr:["Select the `title` and `language` of all films in French or Spanish."],
      hint:"`WHERE language = 'French' OR language = 'Spanish'`",
      starter:"-- French or Spanish language films\n",
      solution:"-- French or Spanish language films\nSELECT title, language\nFROM films\nWHERE language = 'French' OR language = 'Spanish';\n"},
    {type:"video", title:"Filtering text", slides:[
      {h:"LIKE", b:["Search for a pattern in a field","% matches zero, one, or many characters","_ matches exactly one character"], code:"SELECT title\nFROM films\nWHERE title LIKE 'The%';"},
      {h:"NOT LIKE", b:["Find records that don't match the pattern"], code:"SELECT title\nFROM films\nWHERE title NOT LIKE '%a%';"},
      {h:"IN", b:["Shorthand for many OR conditions on the same field"], code:"SELECT title\nFROM films\nWHERE country IN ('Japan', 'South Korea');"}
    ]},
    {type:"code", title:"LIKE and NOT LIKE", xp:100,
      context:"The `LIKE` operator can be used to search for patterns. The `%` wildcard matches none, one or many characters.",
      instr:["Select the `title` of all films whose title starts with `The`."],
      hint:"`WHERE title LIKE 'The%'`",
      starter:"-- Titles starting with The\n",
      solution:"-- Titles starting with The\nSELECT title\nFROM films\nWHERE title LIKE 'The%';\n"},
    {type:"code", title:"WHERE IN", xp:100,
      context:"`IN` lets you specify multiple values in a `WHERE` clause, making it easier and quicker than chaining several `OR` conditions.",
      instr:["Select the `title` and `country` of films from Japan, South Korea or Taiwan."],
      hint:"`WHERE country IN ('Japan', 'South Korea', 'Taiwan')`",
      starter:"-- Films from East Asian countries\n",
      solution:"-- Films from East Asian countries\nSELECT title, country\nFROM films\nWHERE country IN ('Japan', 'South Korea', 'Taiwan');\n"},
    {type:"video", title:"NULL values", slides:[
      {h:"Missing values", b:["NULL represents a missing or unknown value","COUNT(field) skips NULLs"]},

{

  long:"pandas is the world's most popular Python library, used for everything from data manipulation to data analysis. In this course you'll work with weekly sales data from a chain of stores. You'll inspect DataFrames, sort and subset rows and columns, add new columns, compute summary statistics, count values, group data and build pivot tables.",

  chapters:[
  { title:"Transforming DataFrames", desc:"Let's master the pandas basics. Learn how to inspect DataFrames and perform fundamental manipulations, including sorting rows, subsetting, and adding new columns.",

    {type:"video", title:"Introducing DataFrames", slides:[
      {h:"What's pandas?", b:["Python package for data manipulation","Can also be used for data visualization","Built on top of NumPy and Matplotlib"]},
      {h:"Rectangular data", b:["Also called tabular data","Each row is an observation, each column a variable","pandas stores it in a DataFrame"]},
      {h:"Exploring a DataFrame", b:[".head() returns the first rows",".info() shows column names, types and missing values",".shape gives (rows, columns)",".describe() computes summary statistics"], code:"dogs.head()\ndogs.info()\ndogs.shape\ndogs.describe()"},
      {h:"Components of a DataFrame", b:[".values: a 2D NumPy array of the data",".columns: the column labels",".index: the row labels"], code:"dogs.columns\ndogs.index", out:"Index(['name', 'breed', 'color', 'height_cm', 'weight_kg'], dtype='object')\nRangeIndex(start=0, stop=7, step=1)"}
    ]},
    {type:"code", title:"Inspecting a DataFrame", xp:100,

      instr:["Print the head of `sales`.","Print information about the column types and missing values in `sales`.","Print the number of rows and columns in `sales`.","Print some summary statistics that describe `sales`."],
